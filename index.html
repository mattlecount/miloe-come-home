<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; color: #f5e6d3; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #start-screen {
      position: absolute; inset: 0; background: rgba(10,10,10,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer;
    }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="start-screen">
    <h1>Miloe, Come Home</h1>
    <p>Click to begin</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x87a0b0, 20, 80);
    scene.background = new THREE.Color(0x87a0b0);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 4, 22);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
    sun.position.set(8, 15, 10);
    sun.castShadow = true;
    scene.add(sun);

    // Long ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 20),
      new THREE.MeshStandardMaterial({ color: 0x5a6a4a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Simple background elements
    function makeTree(x) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.4, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 0.7;
      g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.8, 7), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      leaves.position.y = 2.0;
      g.add(leaves);
      g.position.set(x, 0, -3);
      scene.add(g);
    }
    for (let i = -30; i <= 30; i += 6) makeTree(i + (i%2)*1.5);

    // House at center-right for ending
    const house = new THREE.Group();
    const hBody = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 3), new THREE.MeshStandardMaterial({ color: 0xc4a882 }));
    hBody.position.y = 1.5;
    house.add(hBody);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.9, 0.15), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    door.position.set(0, 0.95, 1.55);
    house.add(door);
    house.position.set(2, 0, -1);
    house.visible = false;
    scene.add(house);

    // Detailed dog, will be scaled later to half Ava's height
    function createDog() {
      const g = new THREE.Group();
      const gray = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.55 });
      const white = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x1c1917 });

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.65, 8, 12), gray);
      torso.rotation.x = Math.PI / 2;
      torso.position.y = 0.58;
      torso.castShadow = true;
      g.add(torso);

      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), white);
      chest.position.set(0, 0.52, 0.32);
      chest.scale.set(1.1, 0.9, 1.2);
      g.add(chest);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.28, 10), gray);
      neck.position.set(0, 0.72, 0.38);
      neck.rotation.x = 0.3;
      g.add(neck);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), gray);
      head.position.set(0, 0.86, 0.58);
      head.scale.set(1.25, 0.95, 1.05);
      head.castShadow = true;
      g.add(head);

      const blaze = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), white);
      blaze.position.set(0, 0.96, 0.78);
      blaze.scale.set(0.7, 1.1, 0.6);
      g.add(blaze);

      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), white);
      muzzle.position.set(0, 0.74, 0.88);
      muzzle.scale.set(1.2, 0.75, 1.3);
      g.add(muzzle);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), dark);
      nose.position.set(0, 0.78, 1.02);
      g.add(nose);

      [-0.13, 0.13].forEach(x => {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.048, 8, 8), new THREE.MeshStandardMaterial({ color: 0xf5f5f4 }));
        e.position.set(x, 0.88, 0.82);
        g.add(e);
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.028, 6, 6), new THREE.MeshStandardMaterial({ color: 0x3f2a1d }));
        p.position.set(x, 0.88, 0.86);
        g.add(p);
      });

      const earMat = new THREE.MeshStandardMaterial({ color: 0x57534e });
      [-0.26, 0.26].forEach(x => {
        const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.22, 4, 6), earMat);
        ear.scale.set(0.7, 1.6, 0.45);
        ear.position.set(x, 1.02, 0.48);
        ear.rotation.z = x > 0 ? -0.4 : 0.4;
        g.add(ear);
      });

      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.038, 8, 16), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, 0.68, 0.4);
      g.add(collar);

      const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.32, 4, 6), gray);
      tail.position.set(0, 0.72, -0.52);
      tail.rotation.x = 0.5;
      g.add(tail);
      g.userData.tail = tail;

      const legs = [];
      [[0.24, 0.32], [-0.24, 0.32], [0.22, -0.3], [-0.22, -0.3]].forEach(([x, z]) => {
        const leg = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.2, 4, 6), gray);
        upper.position.y = 0.14;
        leg.add(upper);
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.095, 8, 8), white);
        paw.position.y = -0.18;
        paw.scale.set(1.05, 0.5, 1.2);
        leg.add(paw);
        leg.position.set(x, 0.32, z);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }

    const dog = createDog();
    dog.position.set(-28, 0, 0);
    dog.rotation.y = Math.PI / 2; // face right (+X)
    scene.add(dog);

    // Family
    function createPerson(scale, hairColor, shirtColor) {
      const g = new THREE.Group();
      g.scale.setScalar(scale);
      const skin = 0xf5d0b5;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.6, 6, 8), new THREE.MeshStandardMaterial({ color: shirtColor }));
      body.position.y = 0.95;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), new THREE.MeshStandardMaterial({ color: skin }));
      head.position.y = 1.55;
      g.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshStandardMaterial({ color: hairColor }));
      hair.position.y = 1.68;
      hair.scale.set(1, 0.65, 1);
      g.add(hair);
      const arms = [];
      [-0.32, 0.32].forEach(x => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: skin }));
        arm.position.set(x, 1.0, 0);
        g.add(arm);
        arms.push(arm);
      });
      g.userData.arms = arms;
      const legs = [];
      [-0.12, 0.12].forEach(x => {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: 0x44403c }));
        leg.position.set(x, 0.35, 0);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }

    const familyData = [
      { scale: 1.15, hair: 0x3f3f46, shirt: 0x1e40af }, // Matt
      { scale: 1.0, hair: 0x5c4033, shirt: 0x7c3aed },  // Carly
      { scale: 0.8, hair: 0x5c4033, shirt: 0xf59e0b },  // Ella
      { scale: 0.65, hair: 0xf5d76e, shirt: 0xec4899 }  // Ava
    ];
    const people = [];
    familyData.forEach((p, i) => {
      const person = createPerson(p.scale, p.hair, p.shirt);
      person.position.set(22 + i * 1.4, 0, 0);
      person.rotation.y = -Math.PI / 2; // face left
      scene.add(person);
      people.push(person);
    });

    // Scale dog to half Ava's height
    // Ava scale 0.65, roughly ~1.9 units tall unscaled → ~1.23 tall. Half = ~0.62. Dog unscaled ~1.1 tall.
    const avaHeight = 0.65 * 1.9;
    const targetDogHeight = avaHeight * 0.5;
    const currentDogHeight = 1.15;
    dog.scale.setScalar(targetDogHeight / currentDogHeight);

    // Audio
    const audio = new Audio('miloe.m4a');
    let audioCtx, analyser, dataArray, source;
    let started = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    startScreen.addEventListener('click', async () => {
      if (started) return;
      started = true;
      initAudio();
      await audioCtx.resume();
      audio.play();
      startScreen.classList.add('hidden');
    });

    const clock = new THREE.Clock();

    function animateWalk(legs, arms, t, speed = 1.4, legAmp = 0.4, armAmp = 0.3) {
      const phase = t * speed * 5;
      if (legs) legs.forEach((leg, i) => {
        const p = (i === 0 || i === 3) ? 0 : Math.PI;
        leg.rotation.x = Math.sin(phase + p) * legAmp;
      });
      if (arms) arms.forEach((arm, i) => {
        const p = i === 0 ? Math.PI : 0;
        arm.rotation.x = Math.sin(phase + p) * armAmp;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;
      const duration = audio.duration || 248;
      const progress = Math.min(time / duration, 1);

      // Walk toward each other across the whole scene
      const dogStart = -28;
      const familyStart = 22;
      const meetX = 0;
      const walkDist = (meetX - dogStart) * Math.min(progress * 1.15, 1);

      dog.position.x = dogStart + walkDist;
      dog.position.y = Math.abs(Math.sin(t * 5)) * 0.02;
      animateWalk(dog.userData.legs, null, t, 1.6, 0.45);
      if (dog.userData.tail) dog.userData.tail.rotation.x = 0.4 + Math.sin(t * 3.5) * 0.35;

      people.forEach((person, i) => {
        const offset = (i - 1.5) * 1.3;
        person.position.x = familyStart - walkDist * 0.95 + offset;
        person.position.y = Math.abs(Math.sin(t * 4.2 + i)) * 0.015;
        animateWalk(person.userData.legs, person.userData.arms, t + i * 0.4, 1.3, 0.38, 0.28);
      });

      // Camera: wide start, slowly zoom in while always framing everyone
      const allX = [dog.position.x, ...people.map(p => p.position.x)];
      const minX = Math.min(...allX) - 2;
      const maxX = Math.max(...allX) + 2;
      const centerX = (minX + maxX) / 2;
      const span = maxX - minX;

      // Zoom factor increases over time
      const zoom = 1 + progress * 1.8;
      const desiredZ = Math.max(8, span * 0.85 / zoom);
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, centerX, 0.03);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredZ, 0.02);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.2 + (1 - progress) * 1.5, 0.02);
      camera.lookAt(centerX, 1.0, 0);

      // Near the end, show house and move everyone toward it
      if (progress > 0.82) {
        house.visible = true;
        const enter = (progress - 0.82) / 0.18;
        dog.position.x = THREE.MathUtils.lerp(dog.position.x, house.position.x - 1.2, enter * 0.04);
        people.forEach((person, i) => {
          person.position.x = THREE.MathUtils.lerp(person.position.x, house.position.x + (i - 1.5) * 0.7, enter * 0.035);
        });
        door.rotation.y = enter * 0.8;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
