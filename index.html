<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; color: #f5e6d3; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #start-screen {
      position: absolute; inset: 0; background: rgba(10,10,10,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer;
    }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="start-screen">
    <h1>Miloe, Come Home</h1>
    <p>Click to begin</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x87a0b0, 25, 90);
    scene.background = new THREE.Color(0x87a0b0);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 5, 26);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.1);
    sun.position.set(10, 18, 8);
    sun.castShadow = true;
    scene.add(sun);

    // Sky dome
    const skyGeo = new THREE.SphereGeometry(180, 32, 16);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0x87a0b0, side: THREE.BackSide });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // Weather particles
    const weatherCount = 600;
    const weatherPos = new Float32Array(weatherCount * 3);
    const weatherVel = new Float32Array(weatherCount);
    for (let i = 0; i < weatherCount; i++) {
      weatherPos[i*3] = (Math.random()-0.5)*70;
      weatherPos[i*3+1] = Math.random()*25;
      weatherPos[i*3+2] = (Math.random()-0.5)*30;
      weatherVel[i] = 0.05 + Math.random()*0.15;
    }
    const weatherGeo = new THREE.BufferGeometry();
    weatherGeo.setAttribute('position', new THREE.BufferAttribute(weatherPos, 3));
    const weatherMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0 });
    const weather = new THREE.Points(weatherGeo, weatherMat);
    scene.add(weather);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 24),
      new THREE.MeshStandardMaterial({ color: 0x5a6a4a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Trees
    function makeTree(x, seasonColor) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 1.5, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 0.75;
      g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.7, 7), new THREE.MeshStandardMaterial({ color: seasonColor }));
      leaves.position.y = 2.0;
      g.add(leaves);
      g.position.set(x, 0, -4);
      g.userData.leaves = leaves;
      scene.add(g);
      return g;
    }
    const trees = [];
    for (let i = -36; i <= 36; i += 5.5) trees.push(makeTree(i + (Math.random()-0.5)*1.5, 0x2d5a27));

    // House for end
    const house = new THREE.Group();
    const hBody = new THREE.Mesh(new THREE.BoxGeometry(4.2, 3.2, 3), new THREE.MeshStandardMaterial({ color: 0xc4a882 }));
    hBody.position.y = 1.6;
    house.add(hBody);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.9, 0.15), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    door.position.set(0, 0.95, 1.55);
    house.add(door);
    house.position.set(0, 0, -2);
    house.visible = false;
    scene.add(house);

    // Dog
    function createDog() {
      const g = new THREE.Group();
      const gray = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.55 });
      const white = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x1c1917 });

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.65, 8, 12), gray);
      torso.rotation.x = Math.PI / 2;
      torso.position.y = 0.58;
      torso.castShadow = true;
      g.add(torso);

      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), white);
      chest.position.set(0, 0.52, 0.32);
      chest.scale.set(1.1, 0.9, 1.2);
      g.add(chest);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), gray);
      head.position.set(0, 0.86, 0.58);
      head.scale.set(1.25, 0.95, 1.05);
      head.castShadow = true;
      g.add(head);

      const blaze = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), white);
      blaze.position.set(0, 0.96, 0.78);
      g.add(blaze);

      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), white);
      muzzle.position.set(0, 0.74, 0.88);
      muzzle.scale.set(1.2, 0.75, 1.3);
      g.add(muzzle);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), dark);
      nose.position.set(0, 0.78, 1.02);
      g.add(nose);

      [-0.13, 0.13].forEach(x => {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshStandardMaterial({ color: 0xf5f5f4 }));
        e.position.set(x, 0.88, 0.82);
        g.add(e);
      });

      const earMat = new THREE.MeshStandardMaterial({ color: 0x57534e });
      [-0.26, 0.26].forEach(x => {
        const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.22, 4, 6), earMat);
        ear.scale.set(0.7, 1.6, 0.45);
        ear.position.set(x, 1.02, 0.48);
        ear.rotation.z = x > 0 ? -0.4 : 0.4;
        g.add(ear);
      });

      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.038, 8, 16), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, 0.68, 0.4);
      g.add(collar);

      const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.32, 4, 6), gray);
      tail.position.set(0, 0.72, -0.52);
      tail.rotation.x = 0.5;
      g.add(tail);
      g.userData.tail = tail;

      const legs = [];
      [[0.24, 0.32], [-0.24, 0.32], [0.22, -0.3], [-0.22, -0.3]].forEach(([x, z]) => {
        const leg = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.2, 4, 6), gray);
        upper.position.y = 0.14;
        leg.add(upper);
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), white);
        paw.position.y = -0.18;
        paw.scale.set(1.05, 0.5, 1.2);
        leg.add(paw);
        leg.position.set(x, 0.32, z);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      g.userData.body = torso;
      return g;
    }

    const dog = createDog();
    dog.position.set(-32, 0, 0);
    dog.rotation.y = Math.PI / 2;
    scene.add(dog);

    // Family walking side by side
    function createPerson(scale, hairColor, shirtColor) {
      const g = new THREE.Group();
      g.scale.setScalar(scale);
      const skin = 0xf5d0b5;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.6, 6, 8), new THREE.MeshStandardMaterial({ color: shirtColor }));
      body.position.y = 0.95;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), new THREE.MeshStandardMaterial({ color: skin }));
      head.position.y = 1.55;
      g.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshStandardMaterial({ color: hairColor }));
      hair.position.y = 1.68;
      hair.scale.set(1, 0.65, 1);
      g.add(hair);
      const arms = [];
      [-0.32, 0.32].forEach(x => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: skin }));
        arm.position.set(x, 1.0, 0);
        g.add(arm);
        arms.push(arm);
      });
      g.userData.arms = arms;
      const legs = [];
      [-0.12, 0.12].forEach(x => {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: 0x44403c }));
        leg.position.set(x, 0.35, 0);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }

    const familyData = [
      { scale: 1.15, hair: 0x3f3f46, shirt: 0x1e40af },
      { scale: 1.0, hair: 0x5c4033, shirt: 0x7c3aed },
      { scale: 0.8, hair: 0x5c4033, shirt: 0xf59e0b },
      { scale: 0.65, hair: 0xf5d76e, shirt: 0xec4899 }
    ];
    const people = [];
    // Side by side: different Z, same starting X
    const zOffsets = [-1.6, -0.5, 0.5, 1.6];
    familyData.forEach((p, i) => {
      const person = createPerson(p.scale, p.hair, p.shirt);
      person.position.set(26, 0, zOffsets[i]);
      person.rotation.y = -Math.PI / 2;
      scene.add(person);
      people.push(person);
    });

    // Dog half Ava height
    const avaHeight = 0.65 * 1.9;
    dog.scale.setScalar((avaHeight * 0.5) / 1.15);

    // Audio
    const audio = new Audio('miloe.m4a');
    let audioCtx, analyser, dataArray, source;
    let started = false;
    let lying = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    startScreen.addEventListener('click', async () => {
      if (started) return;
      started = true;
      initAudio();
      await audioCtx.resume();
      audio.play();
      startScreen.classList.add('hidden');
    });

    const clock = new THREE.Clock();

    function animateWalk(legs, arms, t, speed = 1.4, legAmp = 0.4, armAmp = 0.3) {
      const phase = t * speed * 5;
      if (legs) legs.forEach((leg, i) => {
        const p = (i === 0 || i === 3) ? 0 : Math.PI;
        leg.rotation.x = Math.sin(phase + p) * legAmp;
      });
      if (arms) arms.forEach((arm, i) => {
        const p = i === 0 ? Math.PI : 0;
        arm.rotation.x = Math.sin(phase + p) * armAmp;
      });
    }

    function setSky(progress, bass) {
      // Seasons / weather over the song
      let skyColor, groundColor, leafColor, weatherColor, weatherOp, sunInt;
      if (progress < 0.2) {
        // Early spring / cool morning
        skyColor = new THREE.Color(0x7eb8d4);
        groundColor = new THREE.Color(0x4a7a4a);
        leafColor = new THREE.Color(0x3a8a3a);
        weatherOp = 0;
      } else if (progress < 0.4) {
        // Summer bright
        skyColor = new THREE.Color(0x5aa0e0);
        groundColor = new THREE.Color(0x5a8a4a);
        leafColor = new THREE.Color(0x2d6a2d);
        weatherOp = 0.15 * bass; // light dust
        weatherColor = 0xffffee;
      } else if (progress < 0.55) {
        // Rainy moment
        skyColor = new THREE.Color(0x5a6a78);
        groundColor = new THREE.Color(0x3a4a3a);
        leafColor = new THREE.Color(0x2a5a2a);
        weatherOp = 0.7;
        weatherColor = 0xaaccff;
      } else if (progress < 0.75) {
        // Autumn
        skyColor = new THREE.Color(0xd4a070);
        groundColor = new THREE.Color(0x6a5a3a);
        leafColor = new THREE.Color(0xc45a2a);
        weatherOp = 0.4;
        weatherColor = 0xffaa55;
      } else {
        // Soft evening / winter light for the lie-down
        skyColor = new THREE.Color(0x6a5a88);
        groundColor = new THREE.Color(0x4a4a5a);
        leafColor = new THREE.Color(0x3a3a4a);
        weatherOp = 0.25;
        weatherColor = 0xeeeeff;
      }

      // Big chorus moments: warm flash
      if ((progress > 0.35 && progress < 0.42) || (progress > 0.6 && progress < 0.68)) {
        skyColor.lerp(new THREE.Color(0xffcc88), 0.6 + bass * 0.3);
        sunInt = 1.8 + bass * 1.2;
      } else {
        sunInt = 1.0;
      }

      skyMat.color.copy(skyColor);
      scene.background.copy(skyColor);
      scene.fog.color.copy(skyColor);
      ground.material.color.copy(groundColor);
      trees.forEach(tr => { if (tr.userData.leaves) tr.userData.leaves.material.color.copy(leafColor); });
      if (weatherColor) weatherMat.color.set(weatherColor);
      weatherMat.opacity = weatherOp;
      sun.intensity = sunInt + bass * 0.3;
      ambient.intensity = 0.5 + (1 - progress) * 0.2;
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;
      const duration = audio.duration || 248;
      const progress = Math.min(time / duration, 1);

      let bass = 0;
      if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        bass = dataArray.slice(0, 10).reduce((a,b)=>a+b,0) / 10 / 255;
      }

      setSky(progress, bass);

      // Weather particles fall
      const wp = weather.geometry.attributes.position.array;
      for (let i = 0; i < weatherCount; i++) {
        wp[i*3+1] -= weatherVel[i] * (weatherMat.opacity > 0.3 ? 1.5 : 0.3);
        if (wp[i*3+1] < 0) wp[i*3+1] = 22;
      }
      weather.geometry.attributes.position.needsUpdate = true;

      // Walk toward each other
      const dogStart = -32;
      const familyStart = 26;
      const meetProgress = Math.min(progress * 1.25, 1);
      const dogX = dogStart + (0 - dogStart) * meetProgress;
      const familyX = familyStart + (0 - familyStart) * meetProgress;

      const closeEnough = Math.abs(dogX - familyX) < 4.5;

      if (!lying && closeEnough && progress > 0.55) {
        lying = true;
      }

      if (!lying) {
        dog.position.x = dogX;
        dog.position.y = Math.abs(Math.sin(t * 5)) * 0.02;
        dog.rotation.y = Math.PI / 2;
        animateWalk(dog.userData.legs, null, t, 1.6, 0.45);
        if (dog.userData.tail) dog.userData.tail.rotation.x = 0.4 + Math.sin(t * 3.5) * 0.35;

        people.forEach((person, i) => {
          person.position.x = familyX;
          person.position.z = zOffsets[i];
          person.position.y = Math.abs(Math.sin(t * 4.2 + i)) * 0.015;
          person.rotation.y = -Math.PI / 2;
          person.rotation.z = 0;
          animateWalk(person.userData.legs, person.userData.arms, t + i * 0.3, 1.3, 0.38, 0.28);
        });
      } else {
        // Lie down together, dog in middle
        const lieT = Math.min((time - (duration * 0.55)) / 8, 1);
        dog.position.x = THREE.MathUtils.lerp(dog.position.x, 0, 0.04);
        dog.position.y = THREE.MathUtils.lerp(dog.position.y, 0.15, 0.05);
        dog.rotation.z = THREE.MathUtils.lerp(dog.rotation.z, Math.PI / 2, 0.06);
        dog.rotation.y = THREE.MathUtils.lerp(dog.rotation.y, 0, 0.04);

        people.forEach((person, i) => {
          const side = i < 2 ? -1 : 1;
          const depth = (i % 2) * 0.8 - 0.4;
          person.position.x = THREE.MathUtils.lerp(person.position.x, side * (1.4 + (i%2)*0.6), 0.04);
          person.position.z = THREE.MathUtils.lerp(person.position.z, depth, 0.04);
          person.position.y = THREE.MathUtils.lerp(person.position.y, 0.25, 0.05);
          person.rotation.z = THREE.MathUtils.lerp(person.rotation.z, side * Math.PI / 2, 0.06);
          person.rotation.y = THREE.MathUtils.lerp(person.rotation.y, 0, 0.04);
        });
        house.visible = true;
        house.position.x = 6;
      }

      // Camera framing
      const allX = [dog.position.x, ...people.map(p => p.position.x)];
      const minX = Math.min(...allX) - 3;
      const maxX = Math.max(...allX) + 3;
      const centerX = (minX + maxX) / 2;
      const span = Math.max(maxX - minX, 8);
      const zoom = lying ? 1.6 : 1 + progress * 1.4;
      const desiredZ = Math.max(10, span * 0.7 / zoom);
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, centerX, 0.025);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredZ, 0.02);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, lying ? 2.8 : 3.5 + (1-progress)*1.2, 0.02);
      camera.lookAt(centerX, 0.8, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
