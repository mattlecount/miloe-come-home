<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; color: #f5e6d3; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #start-screen {
      position: absolute; inset: 0; background: rgba(10,10,10,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer;
    }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="start-screen">
    <h1>Miloe, Come Home</h1>
    <p>Click to begin</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a120c, 0.012);
    scene.background = new THREE.Color(0x0e0c0a);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4.5, 18);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Lights
    const ambient = new THREE.AmbientLight(0xfff4e6, 0.55);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffcc88, 1.4);
    sun.position.set(8, 14, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
    fill.position.set(-6, 5, -4);
    scene.add(fill);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: 0x2c241c, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Soft grass tufts / path
    const path = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 40),
      new THREE.MeshStandardMaterial({ color: 0x3a2e24, roughness: 1 })
    );
    path.rotation.x = -Math.PI / 2;
    path.position.y = 0.01;
    scene.add(path);

    // Helper: simple rounded character parts
    function makePart(geo, color) {
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.05 });
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    // Vector dog
    function createDog() {
      const g = new THREE.Group();
      // Body
      const body = makePart(new THREE.CapsuleGeometry(0.45, 0.9, 6, 12), 0x6b7280);
      body.rotation.z = Math.PI / 2;
      body.position.y = 0.7;
      g.add(body);
      // White chest
      const chest = makePart(new THREE.SphereGeometry(0.28, 12, 12), 0xf5f5f4);
      chest.position.set(0.2, 0.65, 0.25);
      g.add(chest);
      // Head
      const head = makePart(new THREE.SphereGeometry(0.38, 16, 16), 0x6b7280);
      head.position.set(0.7, 0.95, 0);
      g.add(head);
      // White blaze
      const blaze = makePart(new THREE.SphereGeometry(0.18, 10, 10), 0xf5f5f4);
      blaze.position.set(0.85, 1.05, 0);
      g.add(blaze);
      // Snout
      const snout = makePart(new THREE.SphereGeometry(0.18, 10, 10), 0xf5f5f4);
      snout.position.set(1.05, 0.85, 0);
      g.add(snout);
      // Nose
      const nose = makePart(new THREE.SphereGeometry(0.07, 8, 8), 0x1c1917);
      nose.position.set(1.2, 0.88, 0);
      g.add(nose);
      // Ears
      const earL = makePart(new THREE.SphereGeometry(0.16, 8, 8), 0x57534e);
      earL.position.set(0.5, 1.25, 0.22);
      earL.scale.set(0.7, 1.1, 0.5);
      g.add(earL);
      const earR = earL.clone();
      earR.position.z = -0.22;
      g.add(earR);
      // Tail
      const tail = makePart(new THREE.CapsuleGeometry(0.08, 0.5, 4, 8), 0x6b7280);
      tail.position.set(-0.55, 0.95, 0);
      tail.rotation.z = -0.6;
      g.add(tail);
      g.userData.tail = tail;
      // Legs
      const legs = [];
      const legOffsets = [[0.35, 0.25], [0.35, -0.25], [-0.35, 0.25], [-0.35, -0.25]];
      legOffsets.forEach(([x, z]) => {
        const leg = makePart(new THREE.CapsuleGeometry(0.1, 0.4, 4, 8), 0x6b7280);
        leg.position.set(x, 0.35, z);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      g.userData.isDog = true;
      return g;
    }

    // Person
    function createPerson(scale, hairColor, shirtColor, skin = 0xf5d0b5) {
      const g = new THREE.Group();
      g.scale.setScalar(scale);
      // Body
      const body = makePart(new THREE.CapsuleGeometry(0.28, 0.7, 6, 10), shirtColor);
      body.position.y = 1.05;
      g.add(body);
      // Head
      const head = makePart(new THREE.SphereGeometry(0.32, 14, 14), skin);
      head.position.y = 1.75;
      g.add(head);
      // Hair
      const hair = makePart(new THREE.SphereGeometry(0.34, 12, 12), hairColor);
      hair.position.y = 1.88;
      hair.scale.set(1, 0.75, 1);
      g.add(hair);
      // Arms
      const armL = makePart(new THREE.CapsuleGeometry(0.08, 0.45, 4, 6), skin);
      armL.position.set(0.38, 1.1, 0);
      armL.rotation.z = 0.3;
      g.add(armL);
      const armR = armL.clone();
      armR.position.x = -0.38;
      armR.rotation.z = -0.3;
      g.add(armR);
      g.userData.arms = [armL, armR];
      // Legs
      const legL = makePart(new THREE.CapsuleGeometry(0.1, 0.45, 4, 6), 0x44403c);
      legL.position.set(0.15, 0.4, 0);
      g.add(legL);
      const legR = legL.clone();
      legR.position.x = -0.15;
      g.add(legR);
      g.userData.legs = [legL, legR];
      return g;
    }

    const dog = createDog();
    dog.position.set(-6, 0, 2);
    scene.add(dog);

    // Family ordered by size: Matt (tallest), Carly, Ella, Ava (shortest)
    const family = [
      { name: 'Matt', scale: 1.15, hair: 0x3f3f46, shirt: 0x1e3a5f },
      { name: 'Carly', scale: 1.0, hair: 0x5c4033, shirt: 0x7c3aed },
      { name: 'Ella', scale: 0.75, hair: 0x5c4033, shirt: 0xf59e0b },
      { name: 'Ava', scale: 0.62, hair: 0xf5d76e, shirt: 0xec4899 }
    ];
    const people = [];
    family.forEach((p, i) => {
      const person = createPerson(p.scale, p.hair, p.shirt);
      person.position.set(10 + i * 1.6, 0, -1.5 + i * 0.4);
      person.userData.baseX = person.position.x;
      scene.add(person);
      people.push(person);
    });

    // Ambient particles (dust / leaves)
    const pCount = 200;
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      pPos[i*3] = (Math.random() - 0.5) * 40;
      pPos[i*3+1] = Math.random() * 6;
      pPos[i*3+2] = (Math.random() - 0.5) * 30;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.06, color: 0xc4a574, transparent: true, opacity: 0.5 }));
    scene.add(particles);

    // Audio
    const audio = new Audio('miloe.m4a');
    audio.loop = false;
    let audioCtx, analyser, dataArray, source;
    let started = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    startScreen.addEventListener('click', async () => {
      if (started) return;
      started = true;
      initAudio();
      await audioCtx.resume();
      audio.play();
      startScreen.classList.add('hidden');
    });

    // Animation state
    const clock = new THREE.Clock();
    let reunionStarted = false;
    let runningTogether = false;
    const groupCenter = new THREE.Vector3(4, 0, 0);

    function walkCycle(legs, t, speed = 1, amp = 0.4) {
      legs.forEach((leg, i) => {
        const phase = i % 2 === 0 ? 0 : Math.PI;
        leg.rotation.x = Math.sin(t * speed * 6 + phase) * amp;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;
      const duration = audio.duration || 248;

      let bass = 0;
      if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        bass = dataArray.slice(0, 12).reduce((a, b) => a + b, 0) / 12 / 255;
      }

      // Camera follows the story
      const camTarget = new THREE.Vector3();
      if (time < 160) {
        // Alone phase – follow dog loosely
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, dog.position.x * 0.3, 0.02);
        camera.position.z = 18;
        camTarget.copy(dog.position).y = 1;
      } else if (time < 200) {
        // Approaching
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 3, 0.015);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 16, 0.01);
        camTarget.set(5, 1.2, 0);
      } else {
        // Running together
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, groupCenter.x * 0.4, 0.02);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 14, 0.015);
        camTarget.copy(groupCenter).y = 1.5;
      }
      camera.lookAt(camTarget);
      camera.position.y = 4.5 + Math.sin(t * 0.3) * 0.3 + bass * 0.4;

      // Dog behavior
      const tail = dog.userData.tail;
      const dogLegs = dog.userData.legs;

      if (time < 150) {
        // Roaming alone – gentle wander
        dog.position.x = -6 + Math.sin(t * 0.35) * 4;
        dog.position.z = 2 + Math.cos(t * 0.25) * 2.5;
        dog.rotation.y = Math.atan2(
          Math.cos(t * 0.25) * -2.5 * 0.25,
          Math.cos(t * 0.35) * 4 * 0.35
        );
        walkCycle(dogLegs, t, 0.8, 0.25);
        tail.rotation.z = -0.6 + Math.sin(t * 3) * 0.4;
      } else if (time < 195) {
        // Notices family, runs toward them
        const target = new THREE.Vector3(8, 0, 0);
        dog.position.lerp(target, 0.012);
        dog.lookAt(target.x, dog.position.y, target.z);
        walkCycle(dogLegs, t, 1.8, 0.5);
        tail.rotation.z = -0.4 + Math.sin(t * 8) * 0.8;
        if (dog.position.distanceTo(target) < 1.5) reunionStarted = true;
      } else {
        // Reunited – run together
        runningTogether = true;
        const runSpeed = 0.08 + bass * 0.05;
        groupCenter.x += runSpeed;
        dog.position.lerp(new THREE.Vector3(groupCenter.x - 1.2, 0, groupCenter.z + 0.3), 0.08);
        dog.rotation.y = Math.PI / 2;
        walkCycle(dogLegs, t, 2.2, 0.55);
        tail.rotation.z = -0.2 + Math.sin(t * 10) * 1.0;
      }

      // Family
      people.forEach((person, i) => {
        const arms = person.userData.arms;
        const legs = person.userData.legs;
        if (time < 170) {
          // Waiting, slight idle
          person.position.x = person.userData.baseX;
          person.rotation.y = Math.sin(t * 0.4 + i) * 0.15;
          if (arms) arms.forEach((a, ai) => a.rotation.z = (ai === 0 ? 0.3 : -0.3) + Math.sin(t + i) * 0.08);
        } else if (time < 195) {
          // Waving / leaning toward dog
          person.lookAt(dog.position.x, person.position.y + 1, dog.position.z);
          if (arms) arms[0].rotation.z = 0.8 + Math.sin(t * 4) * 0.3;
        } else {
          // Running with the group
          const offset = (i - 1.5) * 1.1;
          person.position.x = groupCenter.x + offset;
          person.position.z = groupCenter.z + (i % 2 === 0 ? 0.4 : -0.3);
          person.rotation.y = Math.PI / 2;
          walkCycle(legs, t + i, 2.0, 0.45);
          if (arms) arms.forEach((a, ai) => a.rotation.z = (ai === 0 ? 0.6 : -0.6) + Math.sin(t * 6 + i) * 0.2);
        }
      });

      // Particles drift
      particles.rotation.y = t * 0.02;
      const arr = particles.geometry.attributes.position.array;
      for (let i = 0; i < pCount; i++) {
        arr[i*3+1] += Math.sin(t + i) * 0.002;
        if (arr[i*3+1] > 6) arr[i*3+1] = 0.5;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      sun.intensity = 1.4 + bass * 0.6;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
