<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #f5e6d3; height: 100dvh; position: fixed; width: 100%; }
    #stage { position: absolute; inset: 0; }
    .scene {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.4s ease;
      transform: scale(1.08);
    }
    .scene.active { opacity: 1; transform: scale(1); transition: opacity 1.4s ease, transform 12s ease-out; }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 40%);
      pointer-events: none;
    }
    .lyric {
      position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%);
      text-align: center; max-width: 80%; font-size: clamp(1.2rem, 3.5vw, 2.2rem);
      font-weight: 500; letter-spacing: 0.02em; text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      opacity: 0; transition: opacity 0.8s;
    }
    .lyric.show { opacity: 1; }
    #start-screen {
      position: absolute; inset: 0; background: rgba(10,10,10,0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer;
    }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
    #rotate-prompt { position: absolute; inset: 0; background: rgba(10,10,10,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; padding: 2rem; }
    #rotate-prompt.show { display: flex; }
    #rotate-prompt .icon { font-size: 4rem; margin-bottom: 1rem; animation: spin 2s ease-in-out infinite; }
    @keyframes spin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    #fullscreen-btn { position: absolute; top: 1rem; right: 1rem; z-index: 15; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    #scrubber { position: absolute; bottom: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 0.75rem; background: rgba(0,0,0,0.55); padding: 0.5rem 1rem; border-radius: 8px; backdrop-filter: blur(4px); min-width: 280px; max-width: 80vw; }
    #scrubber input[type=range] { flex: 1; height: 4px; accent-color: #f5e6d3; cursor: pointer; }
    #scrubber span { font-size: 0.8rem; opacity: 0.85; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="overlay"></div>
  <div class="lyric" id="lyric"></div>
  <div id="rotate-prompt"><div class="icon">↻</div><h2>Please rotate your device</h2><p>This experience works best in landscape</p></div>
  <button id="fullscreen-btn">Fullscreen</button>
  <div id="scrubber"><span id="time-current">0:00</span><input type="range" id="timeline" min="0" max="100" value="0" step="0.1"><span id="time-total">0:00</span></div>
  <div id="start-screen"><h1>Miloe, Come Home</h1><p>Click to begin</p></div>

  <script>
    const scenes = [
      { start: 0, img: 'scenes/dog.jpg', lyric: 'Two years old, Staffordshire grin' },
      { start: 18, img: 'scenes/dog.jpg', lyric: 'Big brown eyes at the shelter gate' },
      { start: 32, img: 'scenes/walk.jpg', lyric: 'You’ve been waiting on your fate' },
      { start: 48, img: 'scenes/home.jpg', lyric: 'I picture pawprints on the floor' },
      { start: 58, img: 'scenes/stars.jpg', lyric: 'Miloe, come home' },
      { start: 78, img: 'scenes/walk.jpg', lyric: 'Matt and Carly, Ella and Ava' },
      { start: 100, img: 'scenes/home.jpg', lyric: 'We’ve got room for all your joy' },
      { start: 120, img: 'scenes/night.jpg', lyric: 'If you spill a bowl, it’s alright' },
      { start: 133, img: 'scenes/walk.jpg', lyric: 'So pick us, if you can' },
      { start: 155, img: 'scenes/stars.jpg', lyric: 'Love can live in the mess tonight' },
      { start: 180, img: 'scenes/fire.jpg', lyric: 'Miloe, come home' },
      { start: 210, img: 'scenes/fire.jpg', lyric: 'We’ve got room for all your joy' },
      { start: 230, img: 'scenes/night.jpg', lyric: '' }
    ];

    const stage = document.getElementById('stage');
    const lyricEl = document.getElementById('lyric');
    const audio = new Audio('miloe.m4a');
    const startScreen = document.getElementById('start-screen');
    let current = -1;
    let started = false;

    // Preload scenes
    scenes.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'scene';
      div.style.backgroundImage = `url(${s.img})`;
      div.dataset.i = i;
      stage.appendChild(div);
    });
    const sceneEls = stage.querySelectorAll('.scene');

    function showScene(idx) {
      if (idx === current) return;
      current = idx;
      sceneEls.forEach((el, i) => el.classList.toggle('active', i === idx));
      const text = scenes[idx].lyric;
      lyricEl.classList.remove('show');
      setTimeout(() => {
        lyricEl.textContent = text;
        if (text) lyricEl.classList.add('show');
      }, 300);
    }

    function update() {
      if (!started) return;
      const t = audio.currentTime;
      let idx = 0;
      for (let i = 0; i < scenes.length; i++) {
        if (t >= scenes[i].start) idx = i;
      }
      showScene(idx);
      // Lights out near end
      if (t > 235) {
        sceneEls.forEach(el => el.style.filter = 'brightness(0.15)');
        lyricEl.style.opacity = '0';
      } else {
        sceneEls.forEach(el => el.style.filter = '');
      }
    }

    startScreen.addEventListener('click', async () => {
      if (started) return;
      started = true;
      startScreen.classList.add('hidden');
      await audio.play();
      showScene(0);
    });

    audio.addEventListener('timeupdate', update);
    setInterval(update, 200);

    // Scrubber
    const timeline = document.getElementById('timeline');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    let scrubbing = false;
    function fmt(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ':' + (sec<10?'0':'') + sec; }
    audio.addEventListener('loadedmetadata', () => { timeline.max = audio.duration; timeTotal.textContent = fmt(audio.duration); });
    timeline.addEventListener('pointerdown', () => scrubbing = true);
    timeline.addEventListener('pointerup', () => scrubbing = false);
    timeline.addEventListener('input', () => { const v = parseFloat(timeline.value); audio.currentTime = v; timeCurrent.textContent = fmt(v); update(); });
    setInterval(() => { if (!scrubbing && audio.duration) { timeline.value = audio.currentTime; timeCurrent.textContent = fmt(audio.currentTime); } }, 200);

    // Fullscreen / orientation
    const rotatePrompt = document.getElementById('rotate-prompt');
    const fsBtn = document.getElementById('fullscreen-btn');
    function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
    function isMobile() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900; }
    function requestFs() { const el = document.documentElement; const fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) return fn.call(el).catch(()=>{}); return Promise.resolve(); }
    function exitFs() { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) fn.call(document); }
    function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function maximizeIOS() { document.body.style.height = window.innerHeight + 'px'; window.scrollTo(0,1); }
    function checkOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      if (isMobile() && portrait) rotatePrompt.classList.add('show');
      else { rotatePrompt.classList.remove('show'); if (isMobile() && !portrait) { if (isIOS()) maximizeIOS(); else if (!isFs()) requestFs(); } }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 150));
    checkOrientation();
    fsBtn.addEventListener('click', () => {
      if (isIOS()) { maximizeIOS(); fsBtn.textContent = 'Maximized'; setTimeout(() => fsBtn.textContent = 'Fullscreen', 1500); return; }
      if (!isFs()) requestFs().then(() => fsBtn.textContent = 'Exit'); else { exitFs(); fsBtn.textContent = 'Fullscreen'; }
    });
    document.addEventListener('fullscreenchange', () => fsBtn.textContent = isFs() ? 'Exit' : 'Fullscreen');
  </script>
</body>
</html>
