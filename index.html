<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #f5e6d3; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #start-screen {
      position: absolute; inset: 0; background: rgba(10,10,10,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer;
    }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }

    #rotate-prompt {
      position: absolute; inset: 0; background: rgba(10,10,10,0.95);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20; text-align: center; padding: 2rem;
    }
    #rotate-prompt.show { display: flex; }
    #rotate-prompt .icon { font-size: 4rem; margin-bottom: 1rem; animation: spin 2s ease-in-out infinite; }
    @keyframes spin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    #fullscreen-btn {
      position: absolute; top: 1rem; right: 1rem; z-index: 15;
      background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    #fullscreen-btn:hover { background: rgba(0,0,0,0.7); }

  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="rotate-prompt">
    <div class="icon">↻</div>
    <h2>Please rotate your device</h2>
    <p>This experience works best in landscape</p>
  </div>
  <button id="fullscreen-btn">Fullscreen</button>

  <div id="start-screen">
    <h1>Miloe, Come Home</h1>
    <p>Click to begin</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const BPM = 116;
    const beat = 60 / BPM;

    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a2030, 20, 100);
    scene.background = new THREE.Color(0x1a2030);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 5, 26);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
    sun.position.set(10, 18, 8);
    sun.castShadow = true;
    scene.add(sun);

    // Animated gradient sky (two layers)
    const skyGeo = new THREE.SphereGeometry(200, 32, 16);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        time: { value: 0 },
        progress: { value: 0 },
        bass: { value: 0 },
        night: { value: 0 }
      },
      vertexShader: `
        varying vec3 vPos;
        void main() {
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform float progress;
        uniform float bass;
        uniform float night;
        varying vec3 vPos;
        void main() {
          float h = normalize(vPos).y;
          vec3 dawn = mix(vec3(0.15,0.2,0.4), vec3(0.9,0.5,0.3), smoothstep(-0.2,0.4,h));
          vec3 day = mix(vec3(0.3,0.55,0.9), vec3(0.6,0.8,1.0), smoothstep(-0.1,0.6,h));
          vec3 dusk = mix(vec3(0.2,0.1,0.3), vec3(0.9,0.4,0.2), smoothstep(-0.2,0.5,h));
          vec3 nightCol = mix(vec3(0.02,0.02,0.08), vec3(0.05,0.08,0.2), smoothstep(-0.3,0.5,h));
          vec3 base = mix(dawn, day, smoothstep(0.0,0.35,progress));
          base = mix(base, dusk, smoothstep(0.45,0.7,progress));
          base = mix(base, nightCol, night);
          float pulse = sin(time * 2.0 + h * 4.0) * 0.08 * bass;
          base += pulse;
          gl_FragColor = vec4(base, 1.0);
        }
      `
    });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // Fireworks
    const fireworks = [];
    function spawnFirework(x, y, z, color) {
      const count = 40;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = [];
      for (let i = 0; i < count; i++) {
        pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
        const theta = Math.random()*Math.PI*2;
        const phi = Math.random()*Math.PI;
        const speed = 4 + Math.random()*6;
        vel.push(new THREE.Vector3(Math.sin(phi)*Math.cos(theta)*speed, Math.cos(phi)*speed, Math.sin(phi)*Math.sin(theta)*speed));
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ size: 0.25, color, transparent: true, opacity: 1 });
      const pts = new THREE.Points(geo, mat);
      scene.add(pts);
      fireworks.push({ pts, vel, life: 1.2 });
    }

    // Weather
    const weatherCount = 400;
    const weatherPos = new Float32Array(weatherCount * 3);
    for (let i = 0; i < weatherCount; i++) {
      weatherPos[i*3] = (Math.random()-0.5)*80;
      weatherPos[i*3+1] = Math.random()*30;
      weatherPos[i*3+2] = (Math.random()-0.5)*30;
    }
    const weatherGeo = new THREE.BufferGeometry();
    weatherGeo.setAttribute('position', new THREE.BufferAttribute(weatherPos, 3));
    const weather = new THREE.Points(weatherGeo, new THREE.PointsMaterial({ size: 0.07, color: 0xffffff, transparent: true, opacity: 0 }));
    scene.add(weather);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 28),
      new THREE.MeshStandardMaterial({ color: 0x4a6a4a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Trees that sway
    function makeTree(x) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, 1.6, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 0.8;
      g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.8, 7), new THREE.MeshStandardMaterial({ color: 0x2d6a2d }));
      leaves.position.y = 2.1;
      g.add(leaves);
      g.position.set(x, 0, -5);
      g.userData.leaves = leaves;
      g.userData.phase = Math.random() * Math.PI * 2;
      scene.add(g);
      return g;
    }
    const trees = [];
    for (let i = -40; i <= 40; i += 5) trees.push(makeTree(i + (Math.random()-0.5)*1.2));

    // House (appears only at end)
    const house = new THREE.Group();
    const hBody = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.4, 3.2), new THREE.MeshStandardMaterial({ color: 0xc4a882 }));
    hBody.position.y = 1.7;
    house.add(hBody);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.4, 4), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
    roof.position.y = 3.6;
    roof.rotation.y = Math.PI/4;
    house.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 0.15), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    door.position.set(0, 1.0, 1.65);
    house.add(door);
    const windowLight = new THREE.PointLight(0xffcc88, 0, 8);
    windowLight.position.set(0, 2.2, 1.2);
    house.add(windowLight);
    house.position.set(8, 0, -1);
    house.visible = false;
    scene.add(house);

    // Dog
    function createDog() {
      const g = new THREE.Group();
      const gray = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.55 });
      const white = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x1c1917 });
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.65, 8, 12), gray);
      torso.rotation.x = Math.PI / 2;
      torso.position.y = 0.58;
      torso.castShadow = true;
      g.add(torso);
      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), white);
      chest.position.set(0, 0.52, 0.32);
      g.add(chest);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), gray);
      head.position.set(0, 0.86, 0.58);
      head.scale.set(1.25, 0.95, 1.05);
      head.castShadow = true;
      g.add(head);
      const blaze = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), white);
      blaze.position.set(0, 0.96, 0.78);
      g.add(blaze);
      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), white);
      muzzle.position.set(0, 0.74, 0.88);
      muzzle.scale.set(1.2, 0.75, 1.3);
      g.add(muzzle);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), dark);
      nose.position.set(0, 0.78, 1.02);
      g.add(nose);
      [-0.13, 0.13].forEach(x => {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshStandardMaterial({ color: 0xf5f5f4 }));
        e.position.set(x, 0.88, 0.82);
        g.add(e);
      });
      const earMat = new THREE.MeshStandardMaterial({ color: 0x57534e });
      [-0.26, 0.26].forEach(x => {
        const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.22, 4, 6), earMat);
        ear.scale.set(0.7, 1.6, 0.45);
        ear.position.set(x, 1.02, 0.48);
        ear.rotation.z = x > 0 ? -0.4 : 0.4;
        g.add(ear);
      });
      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.038, 8, 16), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, 0.68, 0.4);
      g.add(collar);
      const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.32, 4, 6), gray);
      tail.position.set(0, 0.72, -0.52);
      tail.rotation.x = 0.5;
      g.add(tail);
      g.userData.tail = tail;
      const legs = [];
      [[0.24, 0.32], [-0.24, 0.32], [0.22, -0.3], [-0.22, -0.3]].forEach(([x, z]) => {
        const leg = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.2, 4, 6), gray);
        upper.position.y = 0.14;
        leg.add(upper);
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), white);
        paw.position.y = -0.18;
        paw.scale.set(1.05, 0.5, 1.2);
        leg.add(paw);
        leg.position.set(x, 0.32, z);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }
    const dog = createDog();
    dog.position.set(-34, 0, 0);
    dog.rotation.y = Math.PI / 2;
    scene.add(dog);

    function createPerson(scale, hairColor, shirtColor) {
      const g = new THREE.Group();
      g.scale.setScalar(scale);
      const skin = 0xf5d0b5;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.6, 6, 8), new THREE.MeshStandardMaterial({ color: shirtColor }));
      body.position.y = 0.95;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), new THREE.MeshStandardMaterial({ color: skin }));
      head.position.y = 1.55;
      g.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshStandardMaterial({ color: hairColor }));
      hair.position.y = 1.68;
      hair.scale.set(1, 0.65, 1);
      g.add(hair);
      const arms = [];
      [-0.32, 0.32].forEach(x => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: skin }));
        arm.position.set(x, 1.0, 0);
        g.add(arm);
        arms.push(arm);
      });
      g.userData.arms = arms;
      const legs = [];
      [-0.12, 0.12].forEach(x => {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: 0x44403c }));
        leg.position.set(x, 0.35, 0);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }
    const familyData = [
      { scale: 1.15, hair: 0x3f3f46, shirt: 0x1e40af },
      { scale: 1.0, hair: 0x5c4033, shirt: 0x7c3aed },
      { scale: 0.8, hair: 0x5c4033, shirt: 0xf59e0b },
      { scale: 0.65, hair: 0xf5d76e, shirt: 0xec4899 }
    ];
    const people = [];
    const zOffsets = [-1.8, -0.6, 0.6, 1.8];
    familyData.forEach((p, i) => {
      const person = createPerson(p.scale, p.hair, p.shirt);
      person.position.set(28, 0, zOffsets[i]);
      person.rotation.y = -Math.PI / 2;
      scene.add(person);
      people.push(person);
    });
    dog.scale.setScalar((0.65 * 1.9 * 0.5) / 1.15);

    const audio = new Audio('miloe.m4a');
    let audioCtx, analyser, dataArray, source;
    let started = false;
    let entering = false;
    let lightsOut = false;
    let lastFirework = 0;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    startScreen.addEventListener('click', async () => {
      if (started) return;
      started = true;
      initAudio();
      await audioCtx.resume();
      audio.play();
      startScreen.classList.add('hidden');
    });

    const clock = new THREE.Clock();

    function animateWalk(legs, arms, t, speed = 1.4, legAmp = 0.4, armAmp = 0.3) {
      const phase = t * speed * 5;
      if (legs) legs.forEach((leg, i) => {
        const p = (i === 0 || i === 3) ? 0 : Math.PI;
        leg.rotation.x = Math.sin(phase + p) * legAmp;
      });
      if (arms) arms.forEach((arm, i) => {
        const p = i === 0 ? Math.PI : 0;
        arm.rotation.x = Math.sin(phase + p) * armAmp;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;
      const duration = audio.duration || 247.6;
      const progress = Math.min(time / duration, 1);

      let bass = 0;
      if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        bass = dataArray.slice(0, 10).reduce((a,b)=>a+b,0) / 10 / 255;
      }

      // Sky
      skyMat.uniforms.time.value = t;
      skyMat.uniforms.progress.value = progress;
      skyMat.uniforms.bass.value = bass;
      const nightAmount = Math.max(0, (progress - 0.78) / 0.22);
      skyMat.uniforms.night.value = nightAmount;

      // Trees sway to BPM
      const sway = Math.sin(t * (Math.PI * 2) / beat) * 0.08 * (0.5 + bass);
      trees.forEach(tr => {
        tr.rotation.z = sway * Math.sin(tr.userData.phase + t * 0.5);
      });

      // Fireworks on expressive moments (choruses ~0.38, 0.62, 0.85)
      const bigMoments = [0.36, 0.38, 0.40, 0.60, 0.63, 0.66, 0.82, 0.85];
      if (bigMoments.some(m => Math.abs(progress - m) < 0.008) && t - lastFirework > 0.4) {
        lastFirework = t;
        spawnFirework((Math.random()-0.5)*20, 12 + Math.random()*6, -8, new THREE.Color().setHSL(Math.random(), 0.8, 0.6));
      }

      // Update fireworks
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.life -= 0.016;
        const pos = fw.pts.geometry.attributes.position.array;
        for (let j = 0; j < fw.vel.length; j++) {
          pos[j*3] += fw.vel[j].x * 0.016;
          pos[j*3+1] += fw.vel[j].y * 0.016;
          pos[j*3+2] += fw.vel[j].z * 0.016;
          fw.vel[j].y -= 4 * 0.016;
        }
        fw.pts.geometry.attributes.position.needsUpdate = true;
        fw.pts.material.opacity = Math.max(0, fw.life);
        if (fw.life <= 0) {
          scene.remove(fw.pts);
          fireworks.splice(i, 1);
        }
      }

      // Weather
      weather.material.opacity = progress > 0.45 && progress < 0.65 ? 0.5 : (progress > 0.7 ? 0.2 : 0);
      const wp = weather.geometry.attributes.position.array;
      for (let i = 0; i < weatherCount; i++) {
        wp[i*3+1] -= 0.12;
        if (wp[i*3+1] < 0) wp[i*3+1] = 25;
      }
      weather.geometry.attributes.position.needsUpdate = true;

      // Movement
      const meetProgress = Math.min(progress * 1.15, 0.82);
      const dogX = -34 + (4 - (-34)) * meetProgress;
      const familyX = 28 + (4 - 28) * meetProgress;

      if (progress < 0.82) {
        dog.position.x = dogX;
        dog.position.y = Math.abs(Math.sin(t * 5)) * 0.02;
        dog.rotation.y = Math.PI / 2;
        animateWalk(dog.userData.legs, null, t, 1.6, 0.45);
        if (dog.userData.tail) dog.userData.tail.rotation.x = 0.4 + Math.sin(t * 3.5) * 0.35;

        people.forEach((person, i) => {
          person.position.x = familyX;
          person.position.z = zOffsets[i];
          person.position.y = Math.abs(Math.sin(t * 4.2 + i)) * 0.015;
          person.rotation.y = -Math.PI / 2;
          animateWalk(person.userData.legs, person.userData.arms, t + i * 0.3, 1.3, 0.38, 0.28);
        });
      } else {
        // End: house appears, night, they walk in
        house.visible = true;
        windowLight.intensity = lightsOut ? 0 : 2.5;
        const enter = Math.min((progress - 0.82) / 0.15, 1);
        const targetX = house.position.x - 0.5;
        dog.position.x = THREE.MathUtils.lerp(dog.position.x, targetX, 0.03);
        dog.rotation.y = Math.PI / 2;
        animateWalk(dog.userData.legs, null, t, 1.2, 0.3);
        people.forEach((person, i) => {
          person.position.x = THREE.MathUtils.lerp(person.position.x, targetX - 0.8 - i * 0.4, 0.025);
          person.position.z = THREE.MathUtils.lerp(person.position.z, zOffsets[i] * 0.4, 0.02);
          person.rotation.y = Math.PI / 2;
          animateWalk(person.userData.legs, person.userData.arms, t + i, 1.1, 0.25, 0.2);
        });
        door.rotation.y = enter * 0.9;
        if (progress > 0.97) lightsOut = true;
      }

      // Camera
      const allX = [dog.position.x, ...people.map(p => p.position.x), house.visible ? house.position.x : 0];
      const minX = Math.min(...allX) - 3;
      const maxX = Math.max(...allX) + 3;
      const centerX = (minX + maxX) / 2;
      const span = Math.max(maxX - minX, 10);
      const zoom = 1 + progress * 1.2;
      const desiredZ = Math.max(12, span * 0.65 / zoom);
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, centerX, 0.02);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredZ, 0.015);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, nightAmount > 0.5 ? 3.5 : 4.2, 0.02);
      camera.lookAt(centerX, 1.0, 0);

      if (lightsOut) {
        ambient.intensity = THREE.MathUtils.lerp(ambient.intensity, 0.05, 0.02);
        sun.intensity = THREE.MathUtils.lerp(sun.intensity, 0, 0.02);
      } else {
        ambient.intensity = 0.45 + (1 - nightAmount) * 0.2;
        sun.intensity = (1 - nightAmount) * (1.0 + bass * 0.4);
      }

      renderer.render(scene, camera);
    }
    animate();


    // Mobile landscape prompt + fullscreen
    const rotatePrompt = document.getElementById('rotate-prompt');
    const fsBtn = document.getElementById('fullscreen-btn');

    function isMobile() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900;
    }
    function checkOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      if (isMobile() && portrait) {
        rotatePrompt.classList.add('show');
      } else {
        rotatePrompt.classList.remove('show');
        // Auto fullscreen on landscape for mobile
        if (isMobile() && !portrait && !document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        }
      }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 100));
    checkOrientation();

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
        fsBtn.textContent = 'Exit';
      } else {
        document.exitFullscreen?.();
        fsBtn.textContent = 'Fullscreen';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit' : 'Fullscreen';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
