<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #f5e6d3; margin: 0; height: 100dvh; height: -webkit-fill-available; position: fixed; width: 100%; }
    html { height: 100dvh; height: -webkit-fill-available; }
    #canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }
    #start-screen { position: absolute; inset: 0; background: rgba(10,10,10,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
    #rotate-prompt { position: absolute; inset: 0; background: rgba(10,10,10,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; padding: 2rem; }
    #rotate-prompt.show { display: flex; }
    #rotate-prompt .icon { font-size: 4rem; margin-bottom: 1rem; animation: spin 2s ease-in-out infinite; }
    @keyframes spin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    #fullscreen-btn { position: absolute; top: 1rem; right: 1rem; z-index: 15; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    #scrubber { position: absolute; bottom: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 0.75rem; background: rgba(0,0,0,0.55); padding: 0.5rem 1rem; border-radius: 8px; backdrop-filter: blur(4px); min-width: 280px; max-width: 80vw; }
    #scrubber input[type=range] { flex: 1; height: 4px; accent-color: #f5e6d3; cursor: pointer; }
    #scrubber span { font-size: 0.8rem; opacity: 0.85; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="rotate-prompt"><div class="icon">↻</div><h2>Please rotate your device</h2><p>This experience works best in landscape</p></div>
  <button id="fullscreen-btn">Fullscreen</button>
  <div id="scrubber"><span id="time-current">0:00</span><input type="range" id="timeline" min="0" max="100" value="0" step="0.1"><span id="time-total">0:00</span></div>
  <div id="start-screen"><h1>Miloe, Come Home</h1><p>Click to begin</p></div>

  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
    import * as THREE from 'three';

    // Cel-shading gradient map (3 bands)
    function makeToonGradient() {
      const c = document.createElement('canvas');
      c.width = 4; c.height = 1;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#444'; ctx.fillRect(0,0,1,1);
      ctx.fillStyle = '#888'; ctx.fillRect(1,0,1,1);
      ctx.fillStyle = '#ccc'; ctx.fillRect(2,0,1,1);
      ctx.fillStyle = '#fff'; ctx.fillRect(3,0,1,1);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      return tex;
    }
    const toonGradient = makeToonGradient();
    function toonMat(color) {
      return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient });
    }

    const BPM = 116, beat = 60 / BPM;
    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a2030, 25, 120);
    scene.background = new THREE.Color(0x1a2030);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(-20, 3, 8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.4);
    sunLight.position.set(15, 20, 10);
    scene.add(sunLight);

    // Sky
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { time: { value: 0 }, night: { value: 0 }, flash: { value: 0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float time, night, flash;
        varying vec3 vPos;
        void main() {
          float h = normalize(vPos).y;
          vec3 day = mix(vec3(0.4,0.6,0.9), vec3(0.75,0.88,1.0), smoothstep(-0.1,0.6,h));
          vec3 nightCol = mix(vec3(0.01,0.02,0.08), vec3(0.1,0.05,0.3), smoothstep(-0.3,0.6,h));
          float neb = sin(vPos.x*0.03 + time*0.12) * cos(vPos.y*0.04) * 0.2 * night;
          nightCol += vec3(0.35,0.1,0.55) * neb;
          vec3 col = mix(day, nightCol, night);
          col += flash * vec3(1.0, 0.55, 0.75);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), skyMat));

    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdd66 }));
    sunMesh.position.set(20, 16, -30);
    scene.add(sunMesh);
    const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xeeeeff }));
    moonMesh.position.set(-15, 14, -40);
    moonMesh.visible = false;
    scene.add(moonMesh);

    const starCount = 600;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const th = Math.random()*Math.PI*2, ph = Math.acos(Math.random()*2-1), r = 80+Math.random()*25;
      starPos[i*3] = r*Math.sin(ph)*Math.cos(th);
      starPos[i*3+1] = Math.abs(r*Math.cos(ph))*0.55+8;
      starPos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    }
    const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos, 3)), new THREE.PointsMaterial({ size: 0.14, color: 0xffffff, transparent: true, opacity: 0 }));
    scene.add(stars);

    // Outdoor world
    const outdoor = new THREE.Group();
    const ground = new THREE.Mesh(new THREE.BoxGeometry(140, 1.5, 50), new THREE.MeshStandardMaterial({ color: 0x4a7a4a }));
    ground.position.y = -0.75;
    outdoor.add(ground);
    const lake = new THREE.Mesh(new THREE.CircleGeometry(10, 28), new THREE.MeshStandardMaterial({ color: 0x2a6a8a, roughness: 0.3 }));
    lake.rotation.x = -Math.PI/2; lake.position.set(-12, 0.02, -10);
    outdoor.add(lake);

    function makeTree(x, z, s=1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14*s, 0.2*s, 1.5*s, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 0.75*s; g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.85*s, 1.7*s, 7), new THREE.MeshStandardMaterial({ color: 0x2d6a2d }));
      leaves.position.y = 2*s; g.add(leaves);
      g.position.set(x, 0, z);
      g.userData.phase = Math.random()*Math.PI*2;
      outdoor.add(g);
      return g;
    }
    const trees = [];
    for (let i = -45; i <= 45; i += 5.5) {
      trees.push(makeTree(i+(Math.random()-0.5)*1.5, -7-Math.random()*5, 0.6+Math.random()*0.5));
      trees.push(makeTree(i+2.5, -16-Math.random()*6, 0.4+Math.random()*0.35));
    }

    // House they walk into
    const house = new THREE.Group();
    const hBody = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.2, 3), new THREE.MeshStandardMaterial({ color: 0xc4a882 }));
    hBody.position.y = 1.6;
    house.add(hBody);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 1.3, 4), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
    roof.position.y = 3.4; roof.rotation.y = Math.PI/4;
    house.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.15), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    door.position.set(0, 1, 1.55);
    house.add(door);
    house.position.set(28, 0, 0);
    outdoor.add(house);
    scene.add(outdoor);

    // Interior
    const interior = new THREE.Group();
    interior.visible = false;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 7), new THREE.MeshStandardMaterial({ color: 0x8b7355 }));
    floor.rotation.x = -Math.PI/2; interior.add(floor);
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 3.5), new THREE.MeshStandardMaterial({ color: 0xe8dcc8 }));
    backWall.position.set(0, 1.75, -2.5); interior.add(backWall);
    const fireplace = new THREE.Mesh(new THREE.BoxGeometry(2, 1.4, 0.35), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    fireplace.position.set(0, 0.7, -2.3); interior.add(fireplace);
    const fireLight = new THREE.PointLight(0xff6622, 0, 7);
    fireLight.position.set(0, 0.5, -1.8); interior.add(fireLight);
    const fireCount = 35;
    const firePos = new Float32Array(fireCount*3);
    for (let i = 0; i < fireCount; i++) { firePos[i*3]=(Math.random()-0.5)*1; firePos[i*3+1]=Math.random()*1.1; firePos[i*3+2]=-2.1; }
    const fire = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(firePos, 3)), new THREE.PointsMaterial({ size: 0.1, color: 0xff5522, transparent: true }));
    interior.add(fire);
    scene.add(interior);

    // Dog
    function createDog() {
      const g = new THREE.Group();
      const gray = toonMat(0x6b7280);
      const white = toonMat(0xf8fafc);
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.6, 6, 10), gray);
      torso.rotation.x = Math.PI/2; torso.position.y = 0.52; g.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), gray);
      head.position.set(0, 0.78, 0.52); head.scale.set(1.2, 0.95, 1.05); g.add(head);
      const blaze = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), white);
      blaze.position.set(0, 0.88, 0.7); g.add(blaze);
      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), white);
      muzzle.position.set(0, 0.68, 0.8); muzzle.scale.set(1.15, 0.75, 1.25); g.add(muzzle);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), toonMat(0x1c1917));
      nose.position.set(0, 0.72, 0.92); g.add(nose);
      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 6, 12), toonMat(0x2563eb));
      collar.rotation.x = Math.PI/2; collar.position.set(0, 0.62, 0.35); g.add(collar);
      const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.28, 4, 6), gray);
      tail.position.set(0, 0.65, -0.45); tail.rotation.x = 0.5; g.add(tail); g.userData.tail = tail;
      const legs = [];
      [[0.22,0.28],[-0.22,0.28],[0.2,-0.26],[-0.2,-0.26]].forEach(([x,z]) => {
        const leg = new THREE.Group();
        leg.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.16, 4, 6), gray));
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), white);
        paw.position.y = -0.12; paw.scale.set(1,0.5,1.1); leg.add(paw);
        leg.position.set(x, 0.28, z); g.add(leg); legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }
    const dog = createDog();
    dog.scale.setScalar(0.55);
    dog.position.set(-22, 0, 0);
    dog.rotation.y = Math.PI/2;
    scene.add(dog);

    function createPerson(scale, hair, shirt) {
      const g = new THREE.Group(); g.scale.setScalar(scale);
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.55, 6, 8), toonMat(shirt));
      body.position.y = 0.9; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 10), toonMat(0xf5d0b5));
      head.position.y = 1.48; g.add(head);
      const hairM = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), toonMat(hair));
      hairM.position.y = 1.6; hairM.scale.set(1, 0.65, 1); g.add(hairM);
      const arms = [], legs = [];
      [-0.3, 0.3].forEach(x => { const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.35, 4, 6), toonMat(0xf5d0b5)); a.position.set(x, 0.95, 0); g.add(a); arms.push(a); });
      [-0.11, 0.11].forEach(x => { const l = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.35, 4, 6), toonMat(0x44403c)); l.position.set(x, 0.32, 0); g.add(l); legs.push(l); });
      g.userData.arms = arms; g.userData.legs = legs;
      return g;
    }
    const family = [
      createPerson(1.12, 0x3f3f46, 0x1e40af),
      createPerson(0.98, 0x5c4033, 0x7c3aed),
      createPerson(0.78, 0x5c4033, 0xf59e0b),
      createPerson(0.62, 0xf5d76e, 0xec4899)
    ];
    const zOff = [-1.6, -0.5, 0.5, 1.6];
    family.forEach((p, i) => { p.position.set(18, 0, zOff[i]); p.rotation.y = -Math.PI/2; scene.add(p); });

    const fireworks = [];
    function spawnFw(x, y, z, col) {
      const n = 40, geo = new THREE.BufferGeometry(), pos = new Float32Array(n*3), vel = [];
      for (let i = 0; i < n; i++) {
        pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
        const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI, sp=3+Math.random()*4;
        vel.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*sp, Math.cos(ph)*sp, Math.sin(ph)*Math.sin(th)*sp));
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.25, color: col, transparent: true }));
      scene.add(pts); fireworks.push({ pts, vel, life: 1.3 });
    }

    const audio = new Audio('miloe.m4a');
    let audioCtx, analyser, dataArray, source, started = false, lightsOut = false, lastFw = 0, flash = 0;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser); analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    startScreen.addEventListener('click', async () => {
      if (started) return; started = true; initAudio(); await audioCtx.resume(); audio.play(); startScreen.classList.add('hidden');
    });

    const clock = new THREE.Clock();
    function walk(legs, arms, t, spd=1.4, la=0.4, aa=0.3) {
      const ph = t * spd * 5;
      if (legs) legs.forEach((l,i) => l.rotation.x = Math.sin(ph + ((i===0||i===3)?0:Math.PI)) * la);
      if (arms) arms.forEach((a,i) => a.rotation.x = Math.sin(ph + (i===0?Math.PI:0)) * aa);
    }

    // Beats (seconds)
    const B = { approachEnd: 90, meetEnd: 133, sitEnd: 142, forestEnd: 195, enterEnd: 215, interiorEnd: 248 };

    function getPhase(time) {
      if (time < B.approachEnd) return 'approach';
      if (time < B.meetEnd) return 'close';
      if (time < B.sitEnd) return 'sit';
      if (time < B.forestEnd) return 'forest';
      if (time < B.enterEnd) return 'enter';
      return 'interior';
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;
      const phase = getPhase(time);

      let bass = 0;
      if (analyser) { analyser.getByteFrequencyData(dataArray); bass = dataArray.slice(0,8).reduce((a,b)=>a+b,0)/8/255; }

      const night = Math.max(0, Math.min(1, (time - 58) / 25));
      skyMat.uniforms.time.value = t;
      skyMat.uniforms.night.value = night;
      if (time > 143 && time < 147) flash = Math.min(1, flash + 0.06); else flash = Math.max(0, flash - 0.03);
      skyMat.uniforms.flash.value = flash * 0.7;
      // Sun fades and lowers gradually; never hard-pops off
      sunMesh.visible = true;
      sunMesh.position.y = THREE.MathUtils.lerp(16, -2, night);
      sunMesh.material.opacity = Math.max(0.15, 1 - night * 0.85);
      sunMesh.material.transparent = true;
      moonMesh.visible = night > 0.3;
      moonMesh.material.opacity = Math.min(1, (night - 0.3) * 2);
      moonMesh.material.transparent = true;
      stars.material.opacity = night * 0.9;

      const sway = Math.sin(t * Math.PI*2 / beat) * 0.06 * (0.5+bass);
      trees.forEach(tr => tr.rotation.z = sway * Math.sin(tr.userData.phase));

      if (time > 143 && time < 152 && t - lastFw > 0.7) {
        lastFw = t;
        spawnFw((Math.random()-0.5)*16, 12+Math.random()*4, -8, new THREE.Color().setHSL(0.95, 0.8, 0.6));
      }
      for (let i = fireworks.length-1; i >= 0; i--) {
        const fw = fireworks[i]; fw.life -= 0.016;
        const p = fw.pts.geometry.attributes.position.array;
        for (let j = 0; j < fw.vel.length; j++) {
          p[j*3] += fw.vel[j].x*0.016; p[j*3+1] += fw.vel[j].y*0.016; p[j*3+2] += fw.vel[j].z*0.016;
          fw.vel[j].y -= 3*0.016;
        }
        fw.pts.geometry.attributes.position.needsUpdate = true;
        fw.pts.material.opacity = Math.max(0, fw.life);
        if (fw.life <= 0) { scene.remove(fw.pts); fireworks.splice(i,1); }
      }

      outdoor.visible = phase !== 'interior';
      interior.visible = phase === 'interior';

      let camTarget = new THREE.Vector3();
      let camPos = new THREE.Vector3();

      if (phase === 'approach' || phase === 'close') {
        const prog = Math.min(time / B.meetEnd, 1);
        const dogX = -22 + 20 * prog;
        const famX = 18 - 16 * prog;
        dog.position.set(dogX, Math.abs(Math.sin(t*5))*0.015, 0);
        dog.rotation.y = Math.PI/2; dog.rotation.z = 0;
        walk(dog.userData.legs, null, t, 1.6, 0.42);
        if (dog.userData.tail) dog.userData.tail.rotation.x = 0.4 + Math.sin(t*3.5)*0.3;
        family.forEach((p, i) => {
          p.position.set(famX, Math.abs(Math.sin(t*4+i))*0.01, zOff[i]);
          p.rotation.y = -Math.PI/2; p.rotation.z = 0;
          walk(p.userData.legs, p.userData.arms, t+i*0.3, 1.3, 0.36, 0.25);
        });
        // Camera: start tight on dog, open with padding
        const open = Math.min(time / 70, 1);
        const allX = [dogX, famX];
        const cx = (Math.min(...allX) + Math.max(...allX)) / 2;
        const span = Math.abs(famX - dogX) + 14;
        camPos.set(THREE.MathUtils.lerp(dogX, cx, open), 2.8, THREE.MathUtils.lerp(5, Math.max(14, span*0.45), open));
        camTarget.set(THREE.MathUtils.lerp(dogX, cx, open), 0.8, 0);
      } else if (phase === 'sit') {
        const s = Math.min((time - B.meetEnd) / 6, 1);
        dog.position.set(1, 0.04, 0);
        dog.rotation.y = Math.PI/2;
        dog.rotation.z = 0.55 * s;
        family.forEach((p, i) => {
          p.position.set(2.5, 0, zOff[i]*0.6);
          p.rotation.y = THREE.MathUtils.lerp(-Math.PI/2, Math.PI/2, s);
          p.rotation.z = 0;
        });
        camPos.set(2, 2.5, 7);
        camTarget.set(1.5, 0.6, 0);
      } else if (phase === 'forest') {
        const w = Math.min((time - B.sitEnd) / (B.forestEnd - B.sitEnd), 1);
        const gx = 2 + w * 22;
        dog.position.set(gx - 1, Math.abs(Math.sin(t*4.5))*0.015, 0);
        dog.rotation.y = Math.PI/2; dog.rotation.z = 0;
        walk(dog.userData.legs, null, t, 1.4, 0.38);
        family.forEach((p, i) => {
          p.position.set(gx + 0.4 + (i%2)*0.5, Math.abs(Math.sin(t*4+i))*0.01, zOff[i]*0.55);
          p.rotation.y = Math.PI/2; p.rotation.z = 0;
          walk(p.userData.legs, p.userData.arms, t+i*0.2, 1.2, 0.32, 0.22);
        });
        // Camera behind
        camPos.set(gx - 6, 3.2, 0.3);
        camTarget.set(gx + 3, 1.0, 0);
      } else if (phase === 'enter') {
        // Walk seamlessly into the house
        const e = Math.min((time - B.forestEnd) / (B.enterEnd - B.forestEnd), 1);
        const doorX = 28;
        dog.position.set(THREE.MathUtils.lerp(26, doorX - 0.3, e), Math.abs(Math.sin(t*4))*0.01, 0);
        dog.rotation.y = Math.PI/2; dog.rotation.z = 0;
        walk(dog.userData.legs, null, t, 1.2, 0.3);
        family.forEach((p, i) => {
          const targetX = doorX - 0.5 - i * 0.3;
          p.position.set(THREE.MathUtils.lerp(27 + i*0.4, targetX, e), Math.abs(Math.sin(t*3.5+i))*0.01, THREE.MathUtils.lerp(zOff[i]*0.5, 0, e));
          p.rotation.y = Math.PI/2;
          walk(p.userData.legs, p.userData.arms, t+i, 1.1, 0.28, 0.18);
          if (e > 0.75) p.visible = false;
        });
        if (e > 0.8) dog.visible = false;
        door.rotation.y = e * 0.9;
        camPos.set(22, 2.8, 4);
        camTarget.set(doorX, 1.2, 0);
      } else {
        // Interior
        fireLight.intensity = 3.2 + Math.sin(t*7)*0.7;
        const fp = fire.geometry.attributes.position.array;
        for (let i = 0; i < fireCount; i++) { fp[i*3+1] += 0.025; if (fp[i*3+1] > 1.3) fp[i*3+1] = 0.05; }
        fire.geometry.attributes.position.needsUpdate = true;
        dog.visible = true;
        dog.position.set(0, 0.08, -0.9);
        dog.rotation.y = 0; dog.rotation.z = 0.25;
        family.forEach((p, i) => {
          p.visible = true;
          const side = i < 2 ? -1 : 1;
          p.position.set(side*(1.1+(i%2)*0.6), 0.12, -0.4+(i%2)*0.3);
          p.rotation.y = Math.PI; p.rotation.z = side*0.35;
        });
        camPos.set(0, 1.8, 4.5);
        camTarget.set(0, 0.8, -1);
        if (time > 235) lightsOut = true;
      }

      camera.position.lerp(camPos, 0.025);
      camera.lookAt(camTarget);

      if (lightsOut) {
        ambient.intensity = THREE.MathUtils.lerp(ambient.intensity, 0.03, 0.02);
        sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, 0, 0.02);
      } else {
        ambient.intensity = 0.42 + (1-night)*0.2;
        sunLight.intensity = (1-night)*(0.9+bass*0.3);
      }
      renderer.render(scene, camera);
    }
    animate();

    // Scrubber
    const timeline = document.getElementById('timeline');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    let scrubbing = false;
    function fmt(s) { if (!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
    audio.addEventListener('loadedmetadata', () => { timeline.max = audio.duration; timeTotal.textContent = fmt(audio.duration); });
    timeline.addEventListener('pointerdown', () => scrubbing = true);
    timeline.addEventListener('pointerup', () => scrubbing = false);
    timeline.addEventListener('input', () => { const v = parseFloat(timeline.value); audio.currentTime = v; timeCurrent.textContent = fmt(v); });
    setInterval(() => { if (!scrubbing && audio.duration) { timeline.value = audio.currentTime; timeCurrent.textContent = fmt(audio.currentTime); } }, 200);

    // Fullscreen / orientation
    const rotatePrompt = document.getElementById('rotate-prompt');
    const fsBtn = document.getElementById('fullscreen-btn');
    function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
    function isMobile() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900; }
    function requestFs() { const el = document.documentElement; const fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) return fn.call(el).catch(()=>{}); return Promise.resolve(); }
    function exitFs() { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) fn.call(document); }
    function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function maximizeIOS() { document.body.style.height = window.innerHeight+'px'; window.scrollTo(0,1); }
    function checkOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      if (isMobile() && portrait) rotatePrompt.classList.add('show');
      else { rotatePrompt.classList.remove('show'); if (isMobile() && !portrait) { if (isIOS()) maximizeIOS(); else if (!isFs()) requestFs(); } }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 150));
    checkOrientation();
    fsBtn.addEventListener('click', () => {
      if (isIOS()) { maximizeIOS(); fsBtn.textContent='Maximized'; setTimeout(()=>fsBtn.textContent='Fullscreen',1500); return; }
      if (!isFs()) requestFs().then(()=>fsBtn.textContent='Exit'); else { exitFs(); fsBtn.textContent='Fullscreen'; }
    });
    document.addEventListener('fullscreenchange', () => fsBtn.textContent = isFs() ? 'Exit' : 'Fullscreen');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
