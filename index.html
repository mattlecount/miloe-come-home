<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; color: #f5e6d3; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #start-screen {
      position: absolute; inset: 0; background: rgba(10,10,10,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer;
    }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="start-screen">
    <h1>Miloe, Come Home</h1>
    <p>Click to begin</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x87a0b0, 12, 45);
    scene.background = new THREE.Color(0x87a0b0);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.2, 8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
    sun.position.set(5, 12, 8);
    sun.castShadow = true;
    scene.add(sun);

    // Ground that scrolls
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 120),
      new THREE.MeshStandardMaterial({ color: 0x4a6b4a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -40;
    ground.receiveShadow = true;
    scene.add(ground);

    // Environment segments (simple buildings / trees that move past)
    const envGroup = new THREE.Group();
    scene.add(envGroup);

    function makeTree() {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 0.6;
      g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.6, 8), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      leaves.position.y = 1.8;
      g.add(leaves);
      return g;
    }

    function makeBuilding(w = 2, h = 3, d = 2, color = 0x8b7355) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
      body.position.y = h / 2;
      body.castShadow = true;
      g.add(body);
      // windows
      const winMat = new THREE.MeshStandardMaterial({ color: 0xa8d5e5, emissive: 0x224455 });
      for (let i = 0; i < 2; i++) {
        const win = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), winMat);
        win.position.set(-w/4 + i * w/2, h * 0.6, d/2 + 0.01);
        g.add(win);
      }
      return g;
    }

    // Seed environment pieces
    const envPieces = [];
    for (let i = 0; i < 18; i++) {
      const z = -i * 6 - 5;
      const side = i % 2 === 0 ? -1 : 1;
      let piece;
      if (i < 6) {
        // streets / buildings
        piece = makeBuilding(1.8 + Math.random()*1.2, 2.5 + Math.random()*2, 1.5, 0x9c8b7a);
        piece.position.set(side * (3.5 + Math.random()), 0, z);
      } else if (i < 12) {
        // countryside trees
        piece = makeTree();
        piece.position.set(side * (3 + Math.random()*2), 0, z);
        piece.scale.setScalar(0.8 + Math.random()*0.6);
      } else {
        // mix
        piece = Math.random() > 0.5 ? makeTree() : makeBuilding(1.5, 2, 1.2, 0xb8a99a);
        piece.position.set(side * (3.2 + Math.random()*1.5), 0, z);
      }
      envGroup.add(piece);
      envPieces.push(piece);
    }

    // House at the end
    const house = makeBuilding(4, 3.2, 3.5, 0xc4a882);
    house.position.set(0, 0, -55);
    // door
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.15), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    door.position.set(0, 1, 1.8);
    house.add(door);
    house.userData.door = door;
    scene.add(house);

    // Vector dog matching the photo: gray coat, white blaze/chest/paws, blue collar
    function createDog() {
      const g = new THREE.Group();
      const gray = 0x6b7280;
      const white = 0xf8fafc;
      const dark = 0x1e2937;

      // Body
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.85, 8, 12), new THREE.MeshStandardMaterial({ color: gray, roughness: 0.65 }));
      body.rotation.z = Math.PI / 2;
      body.position.y = 0.65;
      body.castShadow = true;
      g.add(body);

      // White chest
      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), new THREE.MeshStandardMaterial({ color: white }));
      chest.position.set(0.15, 0.58, 0.22);
      g.add(chest);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 16), new THREE.MeshStandardMaterial({ color: gray }));
      head.position.set(0.65, 0.88, 0);
      head.castShadow = true;
      g.add(head);

      // White blaze on face
      const blaze = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), new THREE.MeshStandardMaterial({ color: white }));
      blaze.position.set(0.78, 0.98, 0);
      g.add(blaze);

      // Muzzle / snout
      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), new THREE.MeshStandardMaterial({ color: white }));
      muzzle.position.set(0.98, 0.78, 0);
      g.add(muzzle);

      // Nose
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: dark }));
      nose.position.set(1.12, 0.82, 0);
      g.add(nose);

      // Eyes
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x3f2a1d });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), eyeMat);
      eyeL.position.set(0.82, 0.95, 0.14);
      g.add(eyeL);
      const eyeR = eyeL.clone();
      eyeR.position.z = -0.14;
      g.add(eyeR);

      // Ears (floppy)
      const earMat = new THREE.MeshStandardMaterial({ color: 0x57534e });
      const earL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), earMat);
      earL.scale.set(0.6, 1.3, 0.45);
      earL.position.set(0.48, 1.12, 0.2);
      g.add(earL);
      const earR = earL.clone();
      earR.position.z = -0.2;
      g.add(earR);

      // Blue collar
      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.04, 8, 16), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0.42, 0.72, 0);
      g.add(collar);

      // Tail
      const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.45, 4, 8), new THREE.MeshStandardMaterial({ color: gray }));
      tail.position.set(-0.55, 0.85, 0);
      tail.rotation.z = -0.8;
      g.add(tail);
      g.userData.tail = tail;

      // Legs with white paws
      const legs = [];
      [[0.32, 0.22], [0.32, -0.22], [-0.28, 0.22], [-0.28, -0.22]].forEach(([x, z], i) => {
        const leg = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.28, 4, 6), new THREE.MeshStandardMaterial({ color: gray }));
        upper.position.y = 0.18;
        leg.add(upper);
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: white }));
        paw.position.y = -0.05;
        paw.scale.set(1, 0.6, 1.1);
        leg.add(paw);
        leg.position.set(x, 0.32, z);
        g.add(leg);
        legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }

    const dog = createDog();
    dog.position.set(0, 0, 4);
    dog.rotation.y = Math.PI; // facing camera
    scene.add(dog);

    // Family
    function createPerson(scale, hairColor, shirtColor) {
      const g = new THREE.Group();
      g.scale.setScalar(scale);
      const skin = 0xf5d0b5;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.65, 6, 10), new THREE.MeshStandardMaterial({ color: shirtColor }));
      body.position.y = 1.0;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 14), new THREE.MeshStandardMaterial({ color: skin }));
      head.position.y = 1.65;
      g.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshStandardMaterial({ color: hairColor }));
      hair.position.y = 1.78;
      hair.scale.set(1, 0.7, 1);
      g.add(hair);
      const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.4, 4, 6), new THREE.MeshStandardMaterial({ color: skin }));
      armL.position.set(0.35, 1.05, 0);
      g.add(armL);
      const armR = armL.clone();
      armR.position.x = -0.35;
      g.add(armR);
      g.userData.arms = [armL, armR];
      const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.4, 4, 6), new THREE.MeshStandardMaterial({ color: 0x44403c }));
      legL.position.set(0.13, 0.38, 0);
      g.add(legL);
      const legR = legL.clone();
      legR.position.x = -0.13;
      g.add(legR);
      g.userData.legs = [legL, legR];
      return g;
    }

    const familyData = [
      { scale: 1.15, hair: 0x3f3f46, shirt: 0x1e40af }, // Matt
      { scale: 1.0, hair: 0x5c4033, shirt: 0x7c3aed },  // Carly brunette
      { scale: 0.78, hair: 0x5c4033, shirt: 0xf59e0b }, // Ella brunette
      { scale: 0.65, hair: 0xf5d76e, shirt: 0xec4899 }  // Ava blonde
    ];
    const people = [];
    familyData.forEach((p, i) => {
      const person = createPerson(p.scale, p.hair, p.shirt);
      person.position.set(-4 + i * 1.4, 0, -20);
      person.visible = false;
      scene.add(person);
      people.push(person);
    });

    // Audio
    const audio = new Audio('miloe.m4a');
    let audioCtx, analyser, dataArray, source;
    let started = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    startScreen.addEventListener('click', async () => {
      if (started) return;
      started = true;
      initAudio();
      await audioCtx.resume();
      audio.play();
      startScreen.classList.add('hidden');
    });

    const clock = new THREE.Clock();
    let scroll = 0;

    function walkCycle(legs, t, speed = 1.4, amp = 0.35) {
      if (!legs) return;
      legs.forEach((leg, i) => {
        const phase = (i % 2) * Math.PI;
        leg.rotation.x = Math.sin(t * speed * 5 + phase) * amp;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;

      let bass = 0;
      if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        bass = dataArray.slice(0, 10).reduce((a,b)=>a+b,0) / 10 / 255;
      }

      // Environments change with progress
      const progress = Math.min(time / 220, 1);
      if (progress < 0.35) {
        ground.material.color.set(0x5a5a5a); // street
        scene.background.set(0x9aa5b0);
        scene.fog.color.set(0x9aa5b0);
      } else if (progress < 0.65) {
        ground.material.color.set(0x4a6b4a); // countryside
        scene.background.set(0x87b0d0);
        scene.fog.color.set(0x87b0d0);
      } else {
        ground.material.color.set(0x6b5a45); // approaching home
        scene.background.set(0xc4a882);
        scene.fog.color.set(0xc4a882);
      }

      // Scroll world toward viewer (dog walks forward)
      const walkSpeed = 0.12 + bass * 0.04;
      scroll += walkSpeed;
      envPieces.forEach(p => {
        p.position.z += walkSpeed;
        if (p.position.z > 10) p.position.z -= 110;
      });
      house.position.z = -55 + scroll * 0.15;
      ground.position.z = -40 + (scroll % 40);

      // Dog walks toward viewer (slight bob)
      dog.position.y = 0.05 + Math.abs(Math.sin(t * 6)) * 0.04;
      dog.position.x = Math.sin(t * 0.4) * 0.6;
      walkCycle(dog.userData.legs, t, 1.6, 0.4);
      if (dog.userData.tail) dog.userData.tail.rotation.z = -0.7 + Math.sin(t * 4) * 0.5;

      // Family appears halfway
      if (time > 110) {
        people.forEach((person, i) => {
          person.visible = true;
          const targetZ = 2.5 - i * 0.3;
          const targetX = -2.2 + i * 1.3;
          person.position.z = THREE.MathUtils.lerp(person.position.z, targetZ, 0.015);
          person.position.x = THREE.MathUtils.lerp(person.position.x, targetX, 0.02);
          person.rotation.y = Math.PI; // facing camera too
          walkCycle(person.userData.legs, t + i, 1.3, 0.25);
          if (person.userData.arms) {
            person.userData.arms.forEach((a, ai) => {
              a.rotation.z = (ai === 0 ? 0.4 : -0.4) + Math.sin(t * 2 + i) * 0.1;
            });
          }
        });
      }

      // End: everyone moves into the house
      if (time > 200) {
        const enter = Math.min((time - 200) / 30, 1);
        dog.position.z = THREE.MathUtils.lerp(dog.position.z, house.position.z + 1.5, enter * 0.04);
        people.forEach((person, i) => {
          person.position.z = THREE.MathUtils.lerp(person.position.z, house.position.z + 1.2 - i * 0.2, enter * 0.035);
          person.position.x = THREE.MathUtils.lerp(person.position.x, (i - 1.5) * 0.6, enter * 0.03);
        });
        // Open door slightly
        if (house.userData.door) house.userData.door.rotation.y = enter * 0.8;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 6, 0.01);
      } else {
        camera.position.z = 8;
        camera.position.y = 2.2 + Math.sin(t * 0.3) * 0.15;
      }
      camera.lookAt(0, 1.2, dog.position.z - 1);

      sun.intensity = 1.2 + bass * 0.4;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
