<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Miloe, Come Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #f5e6d3; margin: 0; height: 100dvh; height: -webkit-fill-available; position: fixed; width: 100%; }
    html { height: 100dvh; height: -webkit-fill-available; }
    #canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }
    #start-screen { position: absolute; inset: 0; background: rgba(10,10,10,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    #start-screen h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    #start-screen p { font-size: 1.15rem; opacity: 0.75; }
    .hidden { display: none !important; }
    #rotate-prompt { position: absolute; inset: 0; background: rgba(10,10,10,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; padding: 2rem; }
    #rotate-prompt.show { display: flex; }
    #rotate-prompt .icon { font-size: 4rem; margin-bottom: 1rem; animation: spin 2s ease-in-out infinite; }
    @keyframes spin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    #fullscreen-btn { position: absolute; top: 1rem; right: 1rem; z-index: 15; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    #fullscreen-btn:hover { background: rgba(0,0,0,0.7); }
    #scrubber { position: absolute; bottom: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 0.75rem; background: rgba(0,0,0,0.55); padding: 0.5rem 1rem; border-radius: 8px; backdrop-filter: blur(4px); min-width: 280px; max-width: 80vw; }
    #scrubber input[type=range] { flex: 1; height: 4px; accent-color: #f5e6d3; cursor: pointer; }
    #scrubber span { font-size: 0.8rem; opacity: 0.85; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="rotate-prompt"><div class="icon">↻</div><h2>Please rotate your device</h2><p>This experience works best in landscape</p></div>
  <button id="fullscreen-btn">Fullscreen</button>
  <div id="scrubber"><span id="time-current">0:00</span><input type="range" id="timeline" min="0" max="100" value="0" step="0.1"><span id="time-total">0:00</span></div>
  <div id="start-screen"><h1>Miloe, Come Home</h1><p>Click to begin</p></div>

  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
    import * as THREE from 'three';
    const BPM = 116, beat = 60 / BPM;
    const canvas = document.getElementById('canvas');
    const startScreen = document.getElementById('start-screen');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a2030, 30, 140);
    scene.background = new THREE.Color(0x1a2030);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 6, 32);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.0);
    sunLight.position.set(20, 25, 10);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Galactic sky shader
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { time: { value: 0 }, progress: { value: 0 }, night: { value: 0 }, flash: { value: 0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float time, progress, night, flash;
        varying vec3 vPos;
        void main() {
          float h = normalize(vPos).y;
          vec3 day = mix(vec3(0.35,0.55,0.85), vec3(0.7,0.85,1.0), smoothstep(-0.1,0.6,h));
          vec3 dusk = mix(vec3(0.25,0.15,0.35), vec3(0.9,0.45,0.25), smoothstep(-0.2,0.5,h));
          vec3 nightCol = mix(vec3(0.01,0.02,0.08), vec3(0.08,0.05,0.25), smoothstep(-0.3,0.6,h));
          // galactic swirls
          float neb = sin(vPos.x*0.04 + time*0.15) * cos(vPos.y*0.05 + time*0.1) * 0.15;
          nightCol += vec3(0.3,0.1,0.5) * neb * night;
          nightCol += vec3(0.1,0.2,0.4) * abs(sin(vPos.z*0.03 + time*0.08)) * night;
          vec3 base = mix(day, dusk, smoothstep(0.3,0.55,progress));
          base = mix(base, nightCol, night);
          base += flash * vec3(1.0, 0.6, 0.8);
          gl_FragColor = vec4(base, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(220, 32, 16), skyMat));

    // Sun and Moon
    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdd66 }));
    sunMesh.position.set(25, 18, -40);
    scene.add(sunMesh);
    const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xeeeeff }));
    moonMesh.position.set(-18, 16, -50);
    moonMesh.visible = false;
    scene.add(moonMesh);

    // Stars
    const starCount = 800;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const r = 90 + Math.random() * 30;
      starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i*3+1] = Math.abs(r * Math.cos(phi)) * 0.6 + 10;
      starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.15, color: 0xffffff, transparent: true, opacity: 0 }));
    scene.add(stars);

    // Extended ground (thick so it doesn't float)
    const ground = new THREE.Mesh(new THREE.BoxGeometry(160, 2, 80), new THREE.MeshStandardMaterial({ color: 0x4a7a4a, roughness: 0.92 }));
    ground.position.y = -1;
    ground.receiveShadow = true;
    scene.add(ground);

    // Lake
    const lake = new THREE.Mesh(new THREE.CircleGeometry(12, 32), new THREE.MeshStandardMaterial({ color: 0x2a6a8a, roughness: 0.3, metalness: 0.4 }));
    lake.rotation.x = -Math.PI / 2;
    lake.position.set(-15, 0.02, -12);
    scene.add(lake);

    // Depth trees
    function makeTree(x, z, s = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15*s, 0.22*s, 1.6*s, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 0.8*s;
      g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.9*s, 1.8*s, 7), new THREE.MeshStandardMaterial({ color: 0x2d6a2d }));
      leaves.position.y = 2.1*s;
      g.add(leaves);
      g.position.set(x, 0, z);
      g.userData.phase = Math.random() * Math.PI * 2;
      scene.add(g);
      return g;
    }
    const trees = [];
    for (let i = -50; i <= 50; i += 6) {
      trees.push(makeTree(i + (Math.random()-0.5)*2, -8 - Math.random()*6, 0.7 + Math.random()*0.6));
      trees.push(makeTree(i + 3, -18 - Math.random()*8, 0.5 + Math.random()*0.4));
    }

    // Interior scene (used for ending)
    const interior = new THREE.Group();
    interior.visible = false;
    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), new THREE.MeshStandardMaterial({ color: 0x8b7355 }));
    floor.rotation.x = -Math.PI/2;
    interior.add(floor);
    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc8 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 4), wallMat);
    backWall.position.set(0, 2, -3);
    interior.add(backWall);
    // Fireplace
    const fireplace = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.6, 0.4), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    fireplace.position.set(0, 0.8, -2.7);
    interior.add(fireplace);
    const fireLight = new THREE.PointLight(0xff7722, 0, 8);
    fireLight.position.set(0, 0.6, -2.2);
    interior.add(fireLight);
    // Fire particles
    const fireCount = 40;
    const firePos = new Float32Array(fireCount * 3);
    for (let i = 0; i < fireCount; i++) {
      firePos[i*3] = (Math.random()-0.5)*1.2;
      firePos[i*3+1] = Math.random()*1.2;
      firePos[i*3+2] = -2.4;
    }
    const fireGeo = new THREE.BufferGeometry();
    fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
    const fire = new THREE.Points(fireGeo, new THREE.PointsMaterial({ size: 0.12, color: 0xff6622, transparent: true, opacity: 0.8 }));
    interior.add(fire);
    interior.position.set(0, 0, 0);
    scene.add(interior);

    // Characters (same as before, abbreviated)
    function createDog() {
      const g = new THREE.Group();
      const gray = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.55 });
      const white = new THREE.MeshStandardMaterial({ color: 0xf8fafc });
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.65, 8, 12), gray);
      torso.rotation.x = Math.PI/2; torso.position.y = 0.58; torso.castShadow = true; g.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 14), gray);
      head.position.set(0, 0.86, 0.58); head.scale.set(1.25, 0.95, 1.05); g.add(head);
      const blaze = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), white);
      blaze.position.set(0, 0.96, 0.78); g.add(blaze);
      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), white);
      muzzle.position.set(0, 0.74, 0.88); muzzle.scale.set(1.2, 0.75, 1.3); g.add(muzzle);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), new THREE.MeshStandardMaterial({ color: 0x1c1917 }));
      nose.position.set(0, 0.78, 1.02); g.add(nose);
      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 6, 12), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      collar.rotation.x = Math.PI/2; collar.position.set(0, 0.68, 0.4); g.add(collar);
      const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.3, 4, 6), gray);
      tail.position.set(0, 0.72, -0.5); tail.rotation.x = 0.5; g.add(tail); g.userData.tail = tail;
      const legs = [];
      [[0.24,0.32],[-0.24,0.32],[0.22,-0.3],[-0.22,-0.3]].forEach(([x,z]) => {
        const leg = new THREE.Group();
        leg.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.18, 4, 6), gray));
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), white);
        paw.position.y = -0.15; paw.scale.set(1,0.5,1.1); leg.add(paw);
        leg.position.set(x, 0.32, z); g.add(leg); legs.push(leg);
      });
      g.userData.legs = legs;
      return g;
    }
    const dog = createDog();
    dog.position.set(-36, 0, 0);
    dog.rotation.y = Math.PI / 2;
    dog.scale.setScalar((0.65 * 1.9 * 0.5) / 1.15);
    scene.add(dog);

    function createPerson(scale, hair, shirt) {
      const g = new THREE.Group(); g.scale.setScalar(scale);
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.6, 6, 8), new THREE.MeshStandardMaterial({ color: shirt }));
      body.position.y = 0.95; body.castShadow = true; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), new THREE.MeshStandardMaterial({ color: 0xf5d0b5 }));
      head.position.y = 1.55; g.add(head);
      const hairM = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshStandardMaterial({ color: hair }));
      hairM.position.y = 1.68; hairM.scale.set(1, 0.65, 1); g.add(hairM);
      const arms = [], legs = [];
      [-0.32, 0.32].forEach(x => { const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: 0xf5d0b5 })); a.position.set(x,1,0); g.add(a); arms.push(a); });
      [-0.12, 0.12].forEach(x => { const l = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.38, 4, 6), new THREE.MeshStandardMaterial({ color: 0x44403c })); l.position.set(x,0.35,0); g.add(l); legs.push(l); });
      g.userData.arms = arms; g.userData.legs = legs;
      return g;
    }
    const familyData = [
      { scale: 1.15, hair: 0x3f3f46, shirt: 0x1e40af },
      { scale: 1.0, hair: 0x5c4033, shirt: 0x7c3aed },
      { scale: 0.8, hair: 0x5c4033, shirt: 0xf59e0b },
      { scale: 0.65, hair: 0xf5d76e, shirt: 0xec4899 }
    ];
    const people = [];
    const zOffsets = [-1.8, -0.6, 0.6, 1.8];
    familyData.forEach((p, i) => {
      const person = createPerson(p.scale, p.hair, p.shirt);
      person.position.set(30, 0, zOffsets[i]);
      person.rotation.y = -Math.PI / 2;
      scene.add(person);
      people.push(person);
    });

    // Fireworks
    const fireworks = [];
    function spawnFirework(x, y, z, color) {
      const count = 50, geo = new THREE.BufferGeometry(), pos = new Float32Array(count*3), vel = [];
      for (let i = 0; i < count; i++) {
        pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
        const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI, sp = 3+Math.random()*5;
        vel.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*sp, Math.cos(ph)*sp, Math.sin(ph)*Math.sin(th)*sp));
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.3, color, transparent: true, opacity: 1 }));
      scene.add(pts);
      fireworks.push({ pts, vel, life: 1.4 });
    }

    const audio = new Audio('miloe.m4a');
    let audioCtx, analyser, dataArray, source, started = false, lightsOut = false, lastFw = 0, flash = 0;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser); analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    startScreen.addEventListener('click', async () => {
      if (started) return; started = true; initAudio(); await audioCtx.resume(); audio.play(); startScreen.classList.add('hidden');
    });

    const clock = new THREE.Clock();
    function animateWalk(legs, arms, t, speed=1.4, legAmp=0.4, armAmp=0.3) {
      const phase = t * speed * 5;
      if (legs) legs.forEach((leg, i) => { leg.rotation.x = Math.sin(phase + ((i===0||i===3)?0:Math.PI)) * legAmp; });
      if (arms) arms.forEach((arm, i) => { arm.rotation.x = Math.sin(phase + (i===0?Math.PI:0)) * armAmp; });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const time = audio.currentTime || 0;
      const duration = audio.duration || 247.6;
      const progress = Math.min(time / duration, 1);

      let bass = 0;
      if (analyser) { analyser.getByteFrequencyData(dataArray); bass = dataArray.slice(0,10).reduce((a,b)=>a+b,0)/10/255; }

      // Night at 0:58 (58s)
      const nightStart = 58;
      const nightAmount = Math.max(0, Math.min(1, (time - nightStart) / 12));
      skyMat.uniforms.time.value = t;
      skyMat.uniforms.progress.value = progress;
      skyMat.uniforms.night.value = nightAmount;

      // Flash at 2:23 (143s)
      if (time > 143 && time < 148) flash = Math.min(1, flash + 0.05);
      else flash = Math.max(0, flash - 0.02);
      skyMat.uniforms.flash.value = flash * (0.4 + bass * 0.6);

      // Sun / Moon / Stars
      sunMesh.visible = nightAmount < 0.6;
      sunMesh.position.y = 18 - nightAmount * 12;
      moonMesh.visible = nightAmount > 0.3;
      stars.material.opacity = nightAmount * 0.9;

      // Trees sway
      const sway = Math.sin(t * (Math.PI*2)/beat) * 0.07 * (0.5+bass);
      trees.forEach(tr => { tr.rotation.z = sway * Math.sin(tr.userData.phase + t*0.4); });

      // Love fireworks at 2:23
      if (time > 143 && time < 150 && t - lastFw > 0.6) {
        lastFw = t;
        spawnFirework((Math.random()-0.5)*18, 14+Math.random()*5, -10, new THREE.Color().setHSL(0.95 + Math.random()*0.1, 0.8, 0.6));
      }
      // Other chorus moments
      if ([0.36,0.62,0.82].some(m => Math.abs(progress-m)<0.01) && t-lastFw>0.5) {
        lastFw = t;
        spawnFirework((Math.random()-0.5)*16, 12+Math.random()*4, -8, new THREE.Color().setHSL(Math.random(), 0.7, 0.6));
      }

      for (let i = fireworks.length-1; i >= 0; i--) {
        const fw = fireworks[i]; fw.life -= 0.016;
        const pos = fw.pts.geometry.attributes.position.array;
        for (let j = 0; j < fw.vel.length; j++) {
          pos[j*3] += fw.vel[j].x*0.016; pos[j*3+1] += fw.vel[j].y*0.016; pos[j*3+2] += fw.vel[j].z*0.016;
          fw.vel[j].y -= 3.5*0.016;
        }
        fw.pts.geometry.attributes.position.needsUpdate = true;
        fw.pts.material.opacity = Math.max(0, fw.life);
        if (fw.life <= 0) { scene.remove(fw.pts); fireworks.splice(i,1); }
      }

      // Movement
      const meetTime = 140; // around 2:20 they meet
      const meetProgress = Math.min(time / meetTime, 1);
      const dogX = -28 + (0 - (-28)) * meetProgress;
      const familyX = 22 + (0 - 22) * meetProgress;

      if (time < 190) {
        dog.position.x = dogX; dog.position.y = Math.abs(Math.sin(t*5))*0.02; dog.rotation.y = Math.PI/2;
        animateWalk(dog.userData.legs, null, t, 1.6, 0.45);
        if (dog.userData.tail) dog.userData.tail.rotation.x = 0.4 + Math.sin(t*3.5)*0.35;
        people.forEach((person, i) => {
          person.position.x = familyX; person.position.z = zOffsets[i];
          person.position.y = Math.abs(Math.sin(t*4.2+i))*0.015;
          person.rotation.y = -Math.PI/2; person.visible = true;
          animateWalk(person.userData.legs, person.userData.arms, t+i*0.3, 1.3, 0.38, 0.28);
        });
      } else {
        // Interior: everyone chilling by the fire
        interior.visible = true;
        ground.visible = false;
        lake.visible = false;
        trees.forEach(tr => tr.visible = false);
        fireLight.intensity = 3.5 + Math.sin(t*8)*0.8;
        // Animate fire
        const fp = fire.geometry.attributes.position.array;
        for (let i = 0; i < fireCount; i++) {
          fp[i*3+1] += 0.03;
          if (fp[i*3+1] > 1.5) fp[i*3+1] = 0.1;
        }
        fire.geometry.attributes.position.needsUpdate = true;

        // Position everyone sitting in front of fire
        dog.position.set(0, 0.1, -1.2);
        dog.rotation.y = 0;
        dog.rotation.z = 0.3; // relaxed
        people.forEach((person, i) => {
          const side = i < 2 ? -1 : 1;
          person.position.set(side * (1.2 + (i%2)*0.7), 0.15, -0.6 + (i%2)*0.4);
          person.rotation.y = Math.PI; // facing fire
          person.rotation.z = side * 0.4; // leaning
          person.visible = true;
        });
        if (time > 235) lightsOut = true;
      }

      // Camera: start close on dog, slowly pan out with padding, then hold for meeting, then interior
      let desiredZ, lookX, lookY;
      if (time < 190) {
        const panOut = Math.min(time / 100, 1); // first ~100s zoom out
        const allX = [dog.position.x, ...people.map(p => p.position.x)];
        const minX = Math.min(...allX) - 6; // padding
        const maxX = Math.max(...allX) + 6;
        const centerX = (minX + maxX) / 2;
        const span = Math.max(maxX - minX, 8);
        // Start tight on dog, open up
        const startZ = 6;
        const endZ = Math.max(16, span * 0.55);
        desiredZ = THREE.MathUtils.lerp(startZ, endZ, panOut);
        lookX = THREE.MathUtils.lerp(dog.position.x, centerX, panOut);
        lookY = 1.0;
      } else {
        desiredZ = 7;
        lookX = 0;
        lookY = 1.2;
      }
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, lookX, 0.03);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredZ, 0.02);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, time < 190 ? 3.2 : 2.4, 0.02);
      camera.lookAt(lookX, lookY, 0);

      if (lightsOut) {
        ambient.intensity = THREE.MathUtils.lerp(ambient.intensity, 0.04, 0.02);
        sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, 0, 0.02);
      } else {
        ambient.intensity = 0.4 + (1 - nightAmount) * 0.25;
        sunLight.intensity = (1 - nightAmount) * (1.0 + bass * 0.3);
      }
      renderer.render(scene, camera);
    }
    animate();

    // Scrubber
    const timeline = document.getElementById('timeline');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    let scrubbing = false;
    function fmt(s) { if (!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
    audio.addEventListener('loadedmetadata', () => { timeline.max = audio.duration; timeTotal.textContent = fmt(audio.duration); });
    timeline.addEventListener('pointerdown', () => { scrubbing = true; });
    timeline.addEventListener('pointerup', () => { scrubbing = false; });
    timeline.addEventListener('input', () => { const v = parseFloat(timeline.value); audio.currentTime = v; timeCurrent.textContent = fmt(v); });
    setInterval(() => { if (!scrubbing && audio.duration) { timeline.value = audio.currentTime; timeCurrent.textContent = fmt(audio.currentTime); } }, 200);

    // Fullscreen / orientation
    const rotatePrompt = document.getElementById('rotate-prompt');
    const fsBtn = document.getElementById('fullscreen-btn');
    function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
    function isMobile() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900; }
    function requestFs() { const el = document.documentElement; const fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) return fn.call(el).catch(()=>{}); return Promise.resolve(); }
    function exitFs() { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) fn.call(document); }
    function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function maximizeIOS() { document.body.style.height = window.innerHeight + 'px'; window.scrollTo(0,1); }
    function checkOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      if (isMobile() && portrait) rotatePrompt.classList.add('show');
      else { rotatePrompt.classList.remove('show'); if (isMobile() && !portrait) { if (isIOS()) maximizeIOS(); else if (!isFs()) requestFs(); } }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 150));
    checkOrientation();
    fsBtn.addEventListener('click', () => {
      if (isIOS()) { maximizeIOS(); fsBtn.textContent = 'Maximized'; setTimeout(()=>fsBtn.textContent='Fullscreen',1500); return; }
      if (!isFs()) requestFs().then(()=>fsBtn.textContent='Exit'); else { exitFs(); fsBtn.textContent='Fullscreen'; }
    });
    document.addEventListener('fullscreenchange', () => { fsBtn.textContent = isFs() ? 'Exit' : 'Fullscreen'; });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
